---
# Host-wide AmneziaWG tunnel `intranet` (design v2 6.4): the vendor's DKMS kernel module, and the
# config from the operator's environment variable that vpn_conf_env names.
- name: Assert this is Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
    fail_msg: the vpn role installs AmneziaWG from the vendor PPA, which covers Ubuntu only
    quiet: true

# Preflight's checks again, because `--tags vpn` skips preflight: no resolvconf is installed, so
# a DNS line would fail the tunnel, and a full tunnel would take the default route.
- name: Assert the VPN config is set, a split tunnel and without DNS
  ansible.builtin.assert:
    that:
      - vpn_conf | length > 0
      - vpn_conf is not search('(?i)AllowedIPs\\s*=.*(0\\.0\\.0\\.0/0|::/0)')
      - vpn_conf is not search('(?im)^\\s*DNS\\s*=')
    fail_msg: "{{ vpn_conf_env }} must hold the AmneziaWG config, AllowedIPs without 0.0.0.0/0 or ::/0, no DNS line"
    quiet: true
  vars:
    vpn_conf: "{{ lookup('ansible.builtin.env', vpn_conf_env) if vpn_conf_env else '' }}"
  no_log: true

# ppa:amnezia/ppa, signed by the key whose fingerprint Launchpad publishes for it. The keyserver
# refuses HEAD, so get_url cannot preview it in check mode; this module fetches with GET.
- name: Add the AmneziaWG PPA
  ansible.builtin.deb822_repository:
    name: amnezia-ppa
    uris: https://ppa.launchpadcontent.net/amnezia/ppa/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: main
    signed_by: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x75C9DD72C799870E310542E24166F2C257290828
  register: vpn_ppa

# DKMS builds the module for every kernel whose headers are installed.
- name: Install AmneziaWG and the running kernel's headers
  ansible.builtin.apt:
    name: [amneziawg, amneziawg-tools, "linux-headers-{{ ansible_kernel }}"]
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: "{{ 0 if vpn_ppa is changed else 3600 }}"
  environment:
    NEEDRESTART_SUSPEND: "1"
  when: not (ansible_check_mode and vpn_ppa is changed)

- name: Create the AmneziaWG config directory
  ansible.builtin.file:
    path: /etc/amnezia/amneziawg
    state: directory
    mode: "0700"

# The config holds the host's private key: it travels over the task's stdin, so it never passes
# through a controller file or a command line.
- name: Write the tunnel config
  ansible.builtin.shell: |
    set -e; umask 077
    new=$(cat)
    [ -f /etc/amnezia/amneziawg/intranet.conf ] && [ "$(cat /etc/amnezia/amneziawg/intranet.conf)" = "$new" ] && exit 0
    printf '%s' "$new" > /etc/amnezia/amneziawg/intranet.conf && echo changed
  args:
    stdin: "{{ lookup('ansible.builtin.env', vpn_conf_env) }}"
  register: vpn_conf_write
  changed_when: "'changed' in vpn_conf_write.stdout"
  no_log: true
  notify: awg restart

# In check mode on a fresh host the unit template is not installed yet.
- name: Enable and start the tunnel
  ansible.builtin.systemd_service:
    name: awg-quick@intranet.service
    enabled: true
    state: started
    daemon_reload: true
  when: not (ansible_check_mode and vpn_ppa is changed)
