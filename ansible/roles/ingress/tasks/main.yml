---
# preflight.yml is untagged and skipped by `--tags ingress`, so this role checks its own inputs.
- name: Assert the variables this role consumes
  ansible.builtin.assert:
    that:
      - hades_domain is string
      - hades_domain | length > 0
      - hades_label_template is string
      - caddy_port | string is match('^[0-9]+$')
      - caddy_port | int < 65536
      - caddy_config is match('^/.+')
      - hades_live_dir is match('^/.+')
      - hades_config_dir is match('^/.+')
      - ingress_loopback_address is string
      - ingress_loopback_address | length > 0
      - ingress_caddy_api_socket is match('^/.+')
      - tailscale_enabled is boolean
      - cloudflare_team_domain is not defined or (cloudflare_team_domain is string and cloudflare_team_domain | length > 0)
    fail_msg: >-
      hades_domain and ingress_loopback_address must be non-empty strings, caddy_port a port,
      caddy_config, hades_live_dir, hades_config_dir and ingress_caddy_api_socket absolute paths,
      tailscale_enabled a boolean and cloudflare_team_domain, when set, a non-empty string
    quiet: true

# First, so that a run without a token stops before it changes anything.
- name: Cloudflare Tunnel
  ansible.builtin.import_tasks: cloudflared.yml
  tags: [cloudflared]

- name: Caddy
  ansible.builtin.import_tasks: caddy.yml

- name: Write the Cloudflare dashboard runbook
  ansible.builtin.template:
    src: ingress.md.j2
    dest: "{{ hades_config_dir }}/ingress.md"
    owner: root
    group: root
    mode: "0644"

- name: Tailscale
  ansible.builtin.import_tasks: tailscale.yml
  when: tailscale_enabled
  tags: [tailscale]
