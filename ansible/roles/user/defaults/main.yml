---
# dev_users, hades_group, hades_tool_paths, erl_flags, chrome_root and the per-user resource
# policy (dev_user_*, default_limit_nofile, hades_user_slice_dropin_name) are shared defaults in
# roles/host. The asdf, kerl, hex and agent names are the ones the collection documents, so the
# role-prefix rule is waived per line.

# Each user is combined onto {'state': 'present'}, so one without state counts as present.
user_present: >-
  {{ [{'state': 'present'}] | product(dev_users | default([])) | map('combine') | selectattr('state', 'eq', 'present') | list }}
# Homes are <user_home_base>/<name>.
user_home_base: /home

asdf_version: v0.20.2 # noqa: var-naming[no-role-prefix]
asdf_url: "https://github.com/asdf-vm/asdf/releases/download/{{ asdf_version }}/asdf-{{ asdf_version }}-linux-amd64.tar.gz" # noqa: var-naming[no-role-prefix]
# Erlang and Elixir versions come from each project's .tool-versions (`hades up`); only the
# plugins are added here.
asdf_plugins: [erlang, elixir, nodejs, golang, python] # noqa: var-naming[no-role-prefix]
# Global versions, each value a prefix resolved with `asdf latest <plugin> <prefix>` at run
# time. The agent CLIs are installed under the global Node.
asdf_global_versions: # noqa: var-naming[no-role-prefix]
  nodejs: "24"
# A headless Erlang: no wx GUI, Java or ODBC bindings to build.
kerl_configure_options: "--without-wx --without-javac --without-odbc" # noqa: var-naming[no-role-prefix]
# Private Hex repositories: {name, url, key_env, fingerprint_env}; the auth key and the public
# key fingerprint are read from those controller environment variables.
hex_repos: [] # noqa: var-naming[no-role-prefix]
# Command name: npm package. Not pinned: the CLIs update themselves.
agent_clis: # noqa: var-naming[no-role-prefix]
  claude: "@anthropic-ai/claude-code"
  codex: "@openai/codex"
