---
# One present dev user's repositories (loop variable `user`), run as the user. A private one
# needs `gh auth login` and `gh auth setup-git` first; until then its clone fails with a message
# and the run goes on.
- name: Clone the user's repositories # noqa: latest[git] (a dev clone follows the default branch)
  ansible.builtin.git:
    repo: "{{ item }}"
    dest: "{{ user_home }}/{{ item | basename | regex_replace('\\.git$', '') }}"
    update: false
  environment:
    GIT_TERMINAL_PROMPT: "0"
  register: user_repos_clone
  failed_when: false
  loop: "{{ user.repos | default([]) }}"

- name: Report the repositories that could not be cloned
  ansible.builtin.debug:
    msg: >-
      could not clone {{ item.item }} for {{ user.name }}: {{ item.stderr }}. If it is private,
      run `gh auth login` and `gh auth setup-git` as {{ user.name }}, then run the playbook again.
  loop: "{{ user_repos_clone.results | selectattr('rc', 'defined') | rejectattr('rc', 'eq', 0) }}"
  loop_control:
    label: "{{ item.item }}"
