---
# One present dev user (loop variable `user`). Tasks 8 and 9 add their per-user files here.
- name: Account, resource policy and shell environment
  ansible.builtin.import_tasks: account.yml

- name: Toolchain and agent CLIs, as the user
  become: true
  become_user: "{{ user.name }}"
  environment:
    PATH: "{{ user_home }}/.asdf/shims:{{ user_home }}/.asdf/bin:/usr/local/bin:/usr/bin:/bin"
  block:
    - name: Toolchain
      ansible.builtin.import_tasks: toolchain.yml

    - name: Agent CLIs
      ansible.builtin.import_tasks: agents.yml
