---
# One present dev user (loop variable `user`).
- name: Account, resource policy and shell environment
  ansible.builtin.import_tasks: account.yml

- name: GPG key
  ansible.builtin.import_tasks: gpg.yml
  when: user.gpg_key | default(false)
  vars:
    user_gpg_uid: "{{ user.name }}+{{ inventory_hostname }}@{{ hades_domain }}"

- name: Toolchain and ADE daemons, as the user
  become: true
  become_user: "{{ user.name }}"
  environment:
    PATH: "{{ mise_shims }}:/usr/local/bin:/usr/bin:/bin"
    # Otherwise mise points both into the root-owned Elixir install (env.sh.j2).
    MIX_HOME: "{{ user_home }}/.mix"
    MIX_ARCHIVES: "{{ user_home }}/.mix/archives"
    # systemctl --user reaches the user manager, kept running by lingering, through it.
    XDG_RUNTIME_DIR: /run/user/{{ user.uid }}
  block:
    - name: Toolchain
      ansible.builtin.import_tasks: toolchain.yml

    - name: Paseo
      ansible.builtin.import_tasks: ade_paseo.yml
      when: "'paseo' in user.ades"

    - name: Orca
      ansible.builtin.import_tasks: ade_orca.yml
      when: "'orca' in user.ades"
