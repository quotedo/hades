---
# One present dev user (loop variable `user`).
- name: Account, resource policy and shell environment
  ansible.builtin.import_tasks: account.yml

- name: GPG key
  ansible.builtin.import_tasks: gpg.yml
  when: user.gpg_key | default(false)
  vars:
    user_gpg_uid: "{{ user.name }}+{{ inventory_hostname }}@{{ hades_domain }}"

- name: Toolchain, agent CLIs and ADE daemons, as the user
  become: true
  become_user: "{{ user.name }}"
  environment:
    PATH: "{{ user_home }}/.asdf/shims:{{ user_home }}/.asdf/bin:/usr/local/bin:/usr/bin:/bin"
    # systemctl --user reaches the user manager, kept running by lingering, through it.
    XDG_RUNTIME_DIR: /run/user/{{ user.uid }}
  block:
    - name: Toolchain
      ansible.builtin.import_tasks: toolchain.yml

    - name: Agent CLIs
      ansible.builtin.import_tasks: agents.yml

    - name: Write the ADE update script
      ansible.builtin.template:
        src: hades-ade-update.sh.j2
        dest: "{{ user_home }}/.local/bin/hades-ade-update"
        mode: "0755"
      when: user.ades | default([]) | length > 0

    - name: Paseo
      ansible.builtin.import_tasks: ade_paseo.yml
      when: "'paseo' in user.ades | default([])"

    - name: Orca
      ansible.builtin.import_tasks: ade_orca.yml
      when: "'orca' in user.ades | default([])"

    - name: Repositories
      ansible.builtin.import_tasks: repos.yml
