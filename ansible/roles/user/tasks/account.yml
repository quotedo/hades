---
# Group hades, plus sudo for an administrator: `groups` replaces the supplementary groups, so no
# other sudo or docker membership survives a run. sudo asks for the user's password.
- name: Create the account
  ansible.builtin.user:
    name: "{{ user.name }}"
    uid: "{{ user.uid }}"
    groups: "{{ [hades_group] + (['sudo'] if user.admin | default(false) else []) }}"
    append: false
    shell: /bin/bash
    home: "{{ user_home }}"

- name: Create the home and config directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(user.name) }}"
    group: "{{ item.owner | default(user.name) }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "{{ user_home }}", mode: "0750" }
    - { path: "{{ user_home }}/.ssh", mode: "0700" }
    - { path: "{{ user_home }}/.config" }
    - { path: "{{ user_home }}/.config/hades", mode: "0700" }
    - { path: "{{ user_home }}/.config/systemd" }
    - { path: "{{ user_home }}/.config/systemd/user" }
    - { path: "{{ user_home }}/.local" }
    - { path: "{{ user_home }}/.local/bin" }
    - { path: "/etc/systemd/system/user-{{ user.uid }}.slice.d", owner: root }
    - { path: "/etc/systemd/system/user@{{ user.uid }}.service.d", owner: root }
    - { path: "{{ hades_config_dir }}/ssh-keys", owner: root }

# The slice drop-in is named 20-*.conf so that it sorts before the 50-<Property>.conf files
# `systemctl set-property` writes; drop-ins apply in filename order across directories, so an
# operator's set-property value still overrides it.
- name: Write the per-uid resource policy
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: user-slice-dropin.conf.j2, dest: "/etc/systemd/system/user-{{ user.uid }}.slice.d/20-hades.conf" }
    - { src: user-service-dropin.conf.j2, dest: "/etc/systemd/system/user@{{ user.uid }}.service.d/50-hades.conf" }
  register: user_dropins

- name: Write the user manager limits, shell environment and repository list
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ user_home }}/{{ item.dest }}"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - { src: system-user-manager.conf.j2, dest: .config/systemd/user.conf }
    - { src: env.sh.j2, dest: .config/hades/env.sh }
    - { src: repos.j2, dest: .config/hades/repos, mode: "0600" }

# hades-keys (host role) is the one writer of authorized_keys, here and hourly from its timer:
# the static keys, then the GitHub keys (none for an empty login). A failed fetch keeps the file
# and fails this task.
- name: Write the static SSH keys
  ansible.builtin.copy:
    content: "{% for key in user.ssh_keys | default([]) %}{{ key }}\n{% endfor %}"
    dest: "{{ hades_config_dir }}/ssh-keys/{{ user.name }}"
    mode: "0644"

- name: List the GitHub login for hades-keys
  ansible.builtin.lineinfile:
    path: "{{ hades_config_dir }}/github-logins"
    regexp: "^{{ user.name }}:"
    line: "{{ user.name }}:{{ user.github | default('') }}"
    create: true
    mode: "0644"

- name: Write the authorized keys
  ansible.builtin.command: "{{ hades_bin_dir }}/hades-keys {{ user.name }}"
  register: user_keys
  changed_when: "'updated' in user_keys.stdout"
  failed_when: "user_keys.rc != 0 or 'write failed' in user_keys.stdout or ('fetch failed' in user_keys.stdout and user.github is defined)"

# A locked or unset password only: the role never touches a set one. Generated on the host and
# printed once below; nothing stores it. A missed print: `passwd -l <name>`, then apply again.
- name: Read the administrator's password status
  ansible.builtin.command: passwd -S {{ user.name }}
  register: user_passwd
  changed_when: false
  check_mode: false
  when: user.admin | default(false)

- name: Generate the administrator's password
  ansible.builtin.shell: |
    set -e
    pw=$(openssl rand -base64 18)
    chpasswd <<EOF
    {{ user.name }}:$pw
    EOF
    echo "$pw"
  register: user_admin_password
  changed_when: true
  no_log: true
  when: user.admin | default(false) and user_passwd.stdout.split()[1] in ['L', 'NP']

- name: Show the administrator's password, once
  ansible.builtin.debug:
    msg: "{{ user.name }}'s sudo password, shown only now: {{ user_admin_password.stdout }}"
  when: user_admin_password is changed and not ansible_check_mode

- name: Source the shell environment from ~/.bashrc
  ansible.builtin.lineinfile:
    path: "{{ user_home }}/.bashrc"
    line: '. "$HOME/.config/hades/env.sh"'
    insertbefore: BOF
    create: true
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0644"

# Last, so the user manager reads the limits above, after a reload for a changed resource
# policy. Type=notify: this returns once the user manager and its bus are up, so `systemctl
# --user` works.
- name: Start the user manager
  ansible.builtin.systemd_service:
    name: user@{{ user.uid }}.service
    state: started
    daemon_reload: "{{ user_dropins is changed }}"

# Keeps the user manager running without a session.
- name: Enable lingering
  ansible.builtin.command: loginctl enable-linger {{ user.name }}
  args:
    creates: /var/lib/systemd/linger/{{ user.name }}
