---
# One present dev user listing orca, run as the user (loop variable `user`). Preflight requires
# tailscale_enabled for orca: the pairing address must be one clients dial over the tailnet.
- name: Read the Tailscale address Orca pairs on
  ansible.builtin.command: tailscale ip -4
  register: user_tailscale_ip
  changed_when: false
  check_mode: false

- name: Create ~/.local/opt/orca
  ansible.builtin.file:
    path: "{{ user_home }}/.local/opt/orca"
    state: directory
    mode: "0755"

# Downloaded only when absent: Orca updates the AppImage in place, hades-ade-update moves it on.
- name: Download Orca
  ansible.builtin.get_url:
    url: "{{ user_orca_releases_url }}/download/v{{ orca_version }}/orca-linux.AppImage"
    dest: "{{ user_home }}/.local/opt/orca/orca.AppImage"
    mode: "0755"
  register: user_orca_download

# --appimage-extract-and-run unpacks to a temporary directory instead of mounting, so no FUSE.
- name: Write the orca-ide wrapper
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      exec "$HOME/.local/opt/orca/orca.AppImage" --appimage-extract-and-run "$@"
    dest: "{{ user_home }}/.local/bin/orca-ide"
    mode: "0755"
  register: user_orca_wrapper

- name: Write the Orca unit
  ansible.builtin.template:
    src: ade.service.j2
    dest: "{{ user_home }}/.config/systemd/user/orca.service"
    mode: "0644"
  vars:
    ade: orca
  register: user_orca_unit

- name: Enable and start Orca, restarting it after a change
  ansible.builtin.systemd_service:
    name: orca.service
    scope: user
    enabled: true
    daemon_reload: "{{ user_orca_unit is changed }}"
    state: "{{ 'restarted' if [user_orca_download, user_orca_wrapper, user_orca_unit] | select('changed') | list else 'started' }}"
  # In check mode a new unit is not written yet, so systemd cannot find it.
  when: not (ansible_check_mode and user_orca_unit is changed)
