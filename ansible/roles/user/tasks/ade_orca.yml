---
# One present dev user listing orca, run as the user (loop variable `user`). Preflight requires
# tailscale_enabled for orca: the pairing address must be one clients dial over the tailnet.
- name: Read the Tailscale address Orca pairs on
  ansible.builtin.command: tailscale ip -4
  register: user_tailscale_ip
  changed_when: false
  check_mode: false

# The unit records the link's target, so a new orca_version rewrites the unit and restarts Orca.
- name: Read the Orca version link
  ansible.builtin.stat:
    path: "{{ orca_root }}/orca.AppImage"
  register: user_orca_link

- name: Write the Orca unit
  ansible.builtin.template:
    src: ade.service.j2
    dest: "{{ user_home }}/.config/systemd/user/orca.service"
    mode: "0644"
  vars:
    ade: orca
  register: user_orca_unit

- name: Enable and start Orca, restarting it after a change
  ansible.builtin.systemd_service:
    name: orca.service
    scope: user
    enabled: true
    daemon_reload: "{{ user_orca_unit is changed }}"
    state: "{{ 'restarted' if user_orca_unit is changed else 'started' }}"
  # In check mode a new unit is not written yet, so systemd cannot find it.
  when: not (ansible_check_mode and user_orca_unit is changed)
