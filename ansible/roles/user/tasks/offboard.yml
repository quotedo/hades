---
# One absent dev user whose account still exists (loop variable `user`, uid `user_uid`). Once the
# account is gone, the next run skips this file.
- name: Release the user's worktrees
  ansible.builtin.command: hades gc --owner {{ user.name }}
  changed_when: true

# Stops the ADE units running inside it; userdel refuses an account with live processes. Before
# disabling lingering, which would start stopping it without waiting.
- name: Stop the user manager
  ansible.builtin.systemd_service:
    name: user@{{ user_uid }}.service
    state: stopped

- name: Disable lingering
  ansible.builtin.command: loginctl disable-linger {{ user.name }}
  args:
    removes: /var/lib/systemd/linger/{{ user.name }}

- name: Kill the user's remaining processes
  ansible.builtin.command: pkill -KILL -u {{ user.name }}
  register: user_offboard_pkill
  changed_when: user_offboard_pkill.rc == 0
  failed_when: user_offboard_pkill.rc > 1

# Offboard archives are never pruned: the nightly backup's prune pattern does not match them.
- name: Archive the home
  ansible.builtin.command:
    argv: [tar, -czf, "{{ user_offboard_archive }}", -C, "{{ ansible_facts.getent_passwd[user.name][4] }}", .]
    creates: "{{ user_offboard_archive }}"
  vars:
    user_offboard_archive: "{{ backup_dir }}/{{ user.name }}-offboard-{{ ansible_facts.date_time.date }}.tar.gz"

- name: Delete the account and its home
  ansible.builtin.user:
    name: "{{ user.name }}"
    state: absent
    remove: true

# The role created both directories for this uid.
- name: Remove the per-uid resource policy
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/user-{{ user_uid }}.slice.d
    - /etc/systemd/system/user@{{ user_uid }}.service.d

- name: Reload systemd without the resource policy
  ansible.builtin.systemd_service:
    daemon_reload: true
