---
# The toolchain is the host's shared store; only the per-user Hex state is set up here. Without
# Elixir in the store, mix is missing and this is skipped.
- name: Check for mix
  ansible.builtin.command: mix --version
  register: user_mix
  changed_when: false
  failed_when: false
  check_mode: false

- name: Hex, rebar and the private Hex repositories
  when: user_mix.rc == 0
  block:
    - name: Install Hex and rebar
      ansible.builtin.shell: mix local.hex --force && mix local.rebar --force
      args:
        creates: "{{ user_home }}/.mix/archives/hex-*"
      register: user_hex

    # In check mode a new Hex is not installed yet, so mix has no hex.repo task.
    - name: List the Hex repositories
      ansible.builtin.command: mix hex.repo list
      register: user_hex_repos
      changed_when: false
      check_mode: false
      when: hex_repos | length > 0 and not (ansible_check_mode and user_hex is changed)

    - name: Add the private Hex repositories
      ansible.builtin.command:
        argv:
          - mix
          - hex.repo
          - add
          - "{{ item.name }}"
          - "{{ item.url }}"
          - --auth-key
          - "{{ lookup('env', item.key_env) }}"
          - --fetch-public-key
          - "{{ lookup('env', item.fingerprint_env) }}"
      when: user_hex_repos is not skipped and user_hex_repos.stdout is not search('^' ~ item.name ~ '\\s', multiline=True)
      changed_when: true
      no_log: true
      loop: "{{ hex_repos }}"
