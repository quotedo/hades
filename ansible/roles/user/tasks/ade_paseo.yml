---
# One present dev user listing paseo, run as the user (loop variable `user`).
- name: Read the installed Paseo version
  ansible.builtin.command: paseo --version
  register: user_paseo_installed
  changed_when: false
  failed_when: false
  check_mode: false

# Only when missing or older, so a newer Paseo the developer installed is never downgraded.
- name: Install Paseo
  ansible.builtin.shell: npm install -g @getpaseo/cli@{{ paseo_version }} && asdf reshim nodejs
  register: user_paseo_install
  changed_when: true
  when: user_paseo_installed.rc != 0 or user_paseo_installed.stdout is version(paseo_version, '<', version_type='semver')

# Generated on the host once and kept, also when edited by hand; it never touches the
# controller's disk.
- name: Generate the Paseo password, once
  ansible.builtin.shell: |
    umask 077
    pw=$(openssl rand -hex 16)
    printf 'PASEO_PASSWORD=%s\n' "$pw" > {{ (user_home ~ '/.config/hades/paseo.env') | quote }}
    echo "$pw"
  args:
    creates: "{{ user_home }}/.config/hades/paseo.env"
  register: user_paseo_password
  no_log: true

- name: Show the generated Paseo password, once
  ansible.builtin.debug:
    msg: "{{ user.name }}'s Paseo password, stored only in {{ user_home }}/.config/hades/paseo.env: {{ user_paseo_password.stdout }}"
  when: user_paseo_password is changed and not ansible_check_mode

- name: Write the Paseo unit
  ansible.builtin.template:
    src: ade.service.j2
    dest: "{{ user_home }}/.config/systemd/user/paseo.service"
    mode: "0644"
  vars:
    ade: paseo
  register: user_paseo_unit

- name: Enable and start Paseo, restarting it after a change
  ansible.builtin.systemd_service:
    name: paseo.service
    scope: user
    enabled: true
    daemon_reload: "{{ user_paseo_unit is changed }}"
    state: "{{ 'restarted' if [user_paseo_install, user_paseo_password, user_paseo_unit] | select('changed') | list else 'started' }}"
  # In check mode a new unit is not written yet, so systemd cannot find it.
  when: not (ansible_check_mode and user_paseo_unit is changed)
