---
# One present dev user listing paseo, run as the user (loop variable `user`).
- name: Read the installed Paseo version
  ansible.builtin.command: paseo --version
  register: user_paseo_installed
  changed_when: false
  failed_when: false
  check_mode: false

# Only when missing or older, so a newer Paseo the developer installed is never downgraded.
- name: Install Paseo
  ansible.builtin.shell: npm install -g @getpaseo/cli@{{ paseo_version }} && asdf reshim nodejs
  register: user_paseo_install
  changed_when: true
  when: user_paseo_installed.rc != 0 or user_paseo_installed.stdout is version(paseo_version, '<', version_type='semver')

- name: Create ~/.paseo
  ansible.builtin.file:
    path: "{{ user_home }}/.paseo"
    state: directory
    mode: "0700"

# Written once: the daemon saves the settings changed in the app to this file. The listen
# address and relay setting are enforced by paseo.env, which takes precedence over it.
- name: Write the initial Paseo configuration
  ansible.builtin.template:
    src: paseo-config.json.j2
    dest: "{{ user_home }}/.paseo/config.json"
    mode: "0600"
    force: false

# Generated on the host the first time and read back afterwards; it never touches the
# controller's disk.
- name: Read the Paseo password, generating one the first time
  ansible.builtin.shell: |
    set -e
    pw=$(sed -n 's/^PASEO_PASSWORD=//p' {{ (user_home ~ '/.config/hades/paseo.env') | quote }} 2>/dev/null || true)
    if [ -z "$pw" ]; then pw=$(openssl rand -hex 16); echo new; fi
    echo "$pw"
  register: user_paseo_password
  changed_when: "'new' in user_paseo_password.stdout_lines[:-1]"
  check_mode: false
  no_log: true

- name: Write the Paseo environment
  ansible.builtin.template:
    src: paseo.env.j2
    dest: "{{ user_home }}/.config/hades/paseo.env"
    mode: "0600"
  register: user_paseo_env
  no_log: true

- name: Write the Paseo unit
  ansible.builtin.template:
    src: ade.service.j2
    dest: "{{ user_home }}/.config/systemd/user/paseo.service"
    mode: "0644"
  vars:
    ade: paseo
  register: user_paseo_unit

- name: Enable and start Paseo, restarting it after a change
  ansible.builtin.systemd_service:
    name: paseo.service
    scope: user
    enabled: true
    daemon_reload: "{{ user_paseo_unit is changed }}"
    state: "{{ 'restarted' if [user_paseo_install, user_paseo_env, user_paseo_unit] | select('changed') | list else 'started' }}"
  # In check mode a new unit is not written yet, so systemd cannot find it.
  when: not (ansible_check_mode and user_paseo_unit is changed)

- name: Show the generated Paseo password, once
  ansible.builtin.debug:
    msg: >-
      {{ user.name }}'s Paseo password, stored only in {{ user_home }}/.config/hades/paseo.env:
      {{ user_paseo_password.stdout_lines[-1] }}
  when: user_paseo_password is changed and not ansible_check_mode
