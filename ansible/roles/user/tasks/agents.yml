---
- name: Find the global Node
  ansible.builtin.command: asdf where nodejs
  register: user_node
  changed_when: false
  check_mode: false

# Each CLI is installed once under the current global Node; they update themselves.
- name: Install the agent CLIs
  ansible.builtin.shell: npm install -g {{ item.value }} && asdf reshim nodejs
  args:
    creates: "{{ user_node.stdout }}/bin/{{ item.key }}"
  loop: "{{ agent_clis | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
