---
- name: Read the existing accounts
  ansible.builtin.getent:
    database: passwd

- name: Read the existing groups
  ansible.builtin.getent:
    database: group

# The user module would otherwise renumber and regroup, or delete, an existing (protected) account.
# An absent entry may only name an account in group hades: one the role created.
- name: Assert no dev user name belongs to a foreign account
  ansible.builtin.assert:
    that:
      - item.name not in ansible_facts.getent_passwd or ansible_facts.getent_passwd[item.name][1] | int == item.uid
      - item.state == 'present' or item.name not in ansible_facts.getent_passwd
        or item.name in ansible_facts.getent_group[hades_group][2].split(',')
    fail_msg: >-
      dev_users {{ item.name }} ({{ item.state }}, uid {{ item.uid }}) names an account hades did not create
      (uid {{ ansible_facts.getent_passwd[item.name][1] | default('') }}); hades does not take over or delete it
    quiet: true
  loop: "{{ user_present + user_absent }}"
  loop_control:
    label: "{{ item.name }}"

# An absent user without an account is skipped.
- name: Offboard each absent dev user
  ansible.builtin.include_tasks: offboard.yml
  when: user.name in ansible_facts.getent_passwd
  loop: "{{ user_absent }}"
  loop_control:
    loop_var: user
    label: "{{ user.name }}"
  vars:
    user_uid: "{{ ansible_facts.getent_passwd[user.name][1] }}"

# In check mode a new account does not exist yet, so nothing can run as it.
- name: Set up each present dev user
  ansible.builtin.include_tasks: present.yml
  when: not ansible_check_mode or user.name in ansible_facts.getent_passwd
  loop: "{{ user_present }}"
  loop_control:
    loop_var: user
    label: "{{ user.name }}"
  vars:
    user_home: "{{ user_home_base }}/{{ user.name }}"

# sshd adds up every AllowUsers line it reads. Where the operator restricts logins with one in a
# file of their own, the drop-in adds the present dev users; elsewhere it is removed.
# Only the last grep's status counts: whether a file other than the drop-in is left.
- name: Look for an AllowUsers line outside the hades drop-in # noqa: risky-shell-pipe
  ansible.builtin.shell: >-
    grep -lis '^[[:space:]]*AllowUsers' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
    | grep -v /hades-allowusers.conf
  register: user_allowusers
  changed_when: false
  failed_when: user_allowusers.rc > 1
  check_mode: false

- name: Write the sshd AllowUsers drop-in
  ansible.builtin.copy:
    content: |
      # Ansible managed
      AllowUsers {{ user_present | map(attribute='name') | join(' ') }}
    dest: /etc/ssh/sshd_config.d/hades-allowusers.conf
    mode: "0644"
  when: user_allowusers.rc == 0 and user_present | length > 0
  notify: sshd reload

- name: Remove the sshd AllowUsers drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/hades-allowusers.conf
    state: absent
  when: not (user_allowusers.rc == 0 and user_present | length > 0)
  notify: sshd reload
