---
# preflight.yml is untagged and skipped by `--tags services`, so this role checks its own inputs.
# site.yml runs it only when dev_services lists something: compose refuses an empty project.
- name: Assert the variables this role consumes
  ansible.builtin.assert:
    that:
      - dev_services is sequence
      - dev_services is not string
      - dev_services | difference(['rabbitmq', 'localstack', 'redis']) | length == 0
      - services_ports | map('string') | reject('match', '^[0-9]+$') | list | length == 0
      - localstack_buckets is sequence
      - localstack_buckets is not string
      - localstack_buckets | reject('match', '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$') | list | length == 0
    fail_msg: >-
      dev_services must be a list drawn from rabbitmq, localstack and redis, every service port an
      integer and localstack_buckets a list of S3 bucket names (they reach a shell loop)
    quiet: true
  vars:
    services_ports: "{{ [rabbitmq_amqp_port, rabbitmq_management_port, rabbitmq_mqtt_port, localstack_port, redis_port] }}"

# A host that already runs Docker (any install method) keeps it exactly as it is.
- name: Check for Docker Compose
  ansible.builtin.command: docker compose version
  register: services_compose
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Docker CE from Docker's apt repository
  when: services_compose.rc != 0
  block:
    - name: Download Docker's signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Write the Docker source
      ansible.builtin.copy:
        content: |
          # Managed by Ansible (hades services role)
          Types: deb
          URIs: https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}
          Suites: {{ ansible_facts.distribution_release }}
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc
        dest: /etc/apt/sources.list.d/docker.sources
        mode: "0644"

    - name: Install Docker CE
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present
        update_cache: true

- name: Create the services directory
  ansible.builtin.file:
    path: "{{ services_dir }}"
    state: directory
    mode: "0755"

- name: Write the compose project and its unit
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: docker-compose.yml.j2, dest: "{{ services_dir }}/docker-compose.yml", mode: "0644" }
    - { src: rabbitmq-enabled-plugins.j2, dest: "{{ services_dir }}/rabbitmq-enabled-plugins", mode: "0644" }
    - { src: localstack-init.sh.j2, dest: "{{ services_dir }}/localstack-init.sh", mode: "0755" }
    - { src: hades-services.service.j2, dest: /etc/systemd/system/hades-services.service, mode: "0644" }
  loop_control:
    label: "{{ item.dest }}"
  register: services_files
  notify: services recreate

# A changed file is applied by the handler. In check mode a unit file that is about to be written
# does not exist yet.
- name: Enable and start the shared services
  ansible.builtin.systemd_service:
    name: hades-services.service
    enabled: true
    state: started
    daemon_reload: true
  when: not (ansible_check_mode and services_files is changed)
