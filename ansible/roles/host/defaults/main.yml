---
# Shared defaults for every role. They are role defaults of `host`, which site.yml and verify.yml
# list in `roles:`, so every role sees them under any tag selection and inventory still wins.

# The share every VM mounts read-only at the same path: bin/ (hades, hades-port, hades-onboard,
# mise, orca-ide) and orca/. The mise store and /etc/mise are shared the same way.
hades_share: /opt/hades
hades_bin_dir: "{{ hades_share }}/bin"

# hades CLI
hades_version: "0.1.0"
# hades_local_binary_dir: a controller directory holding `hades` and `hades-port`; when set,
# both are copied from there instead of fetching the release (development only).
hades_config_dir: /etc/hades
dev_services: []
# Clone URLs every developer gets; a dev_users entry's repos replaces the list.
dev_repos: []

# The present developers, each combined onto its defaults, with its VM's address: the first two
# octets of vm_subnet, then uid // 256 and uid % 256.
dev_present: >-
  {% set ns = namespace(devs=[]) %}{% for d in dev_users | default([]) if d.state | default('present') == 'present'
  %}{% set ns.devs = ns.devs + [{'state': 'present', 'ades': ['paseo'], 'repos': dev_repos, 'memory': vm_memory, 'cpus': vm_cpus,
  'disk': vm_disk} | combine(d, {'address': (vm_subnet.split('.')[:2] + [d.uid // 256, d.uid % 256]) | join('.')})]
  %}{% endfor %}{{ ns.devs }}
dev_absent: "{{ dev_users | default([]) | selectattr('state', 'defined') | selectattr('state', 'eq', 'absent') | list }}"
# Offboarding keeps each absent developer's home as <backup_dir>/<name>-offboard-<time>.tar.gz.
backup_dir: /var/backups/hades

# One Incus VM per present developer, from the host's Ubuntu release, on a bridge with NAT. Sizes
# are Incus values (GiB, or a percentage of the host's memory); an entry may set memory, cpus, disk.
vm_image: "images:ubuntu/{{ ansible_facts.distribution_version }}/cloud"
vm_bridge: hadesbr0
vm_subnet: 10.88.0.0/16
vm_memory: 28GiB
vm_cpus: "{{ ansible_facts.processor_vcpus }}"
vm_disk: 200GiB

# Cloudflare Access (ingress role): extra emails or @domain entries the policy admits besides the
# present dev users' emails, and the session length (Cloudflare's maximum).
access_allow: []
access_session: 720h
# The Zero Trust team name the ingress role creates the Access organization with, when the
# account has none yet: <cloudflare_team>.cloudflareaccess.com.
cloudflare_team: "hades-{{ hades_domain | replace('.', '-') }}"

# Intranet VPN (vpn role): vpn_conf_env names the operator's environment variable holding the
# host's AmneziaWG config; vpn_probe ("<host>:<port>") is one intranet TCP endpoint verify reaches.
vpn_enabled: false
vpn_conf_env: ""
vpn_probe: ""

# Caddy (installed by the ingress role)
caddy_port: 8090
caddy_config: /etc/caddy/Caddyfile
caddy_reload_command: [systemctl, reload, caddy]
hades_live_dir: /etc/caddy/hades-sites

# Dev services in each VM (vm role)
rabbitmq_management_port: 15672
rabbitmq_amqp_port: 5672
rabbitmq_user: guest
rabbitmq_password: guest
rabbitmq_mqtt_port: 1883
# Outside the ports hades hands to worktrees; the SDK endpoint reaches worktrees via the env file.
localstack_port: 14566
redis_port: 6379

# Shared tool store: mise installs every `tools` version as root under mise_store; the first
# version of each tool is the box default. Versions are exact (preflight). The shims point at
# mise_bin, which the host's /usr/local/bin/mise links to and every VM sees at the same path.
mise_version: "2026.10.18"
mise_bin: "{{ hades_bin_dir }}/mise"
mise_store: /usr/local/share/mise
mise_shims: "{{ mise_store }}/shims"
tools:
  node: ["24.22.1"]
  gh: ["2.103.1"]
kerl_configure_options: "--without-wx --without-javac --without-odbc"
# apt packages every VM gets on top of dev_packages; never removed by the role.
extra_packages: []

# Installed as root with npm under the store's default Node (agents.yml). agent_clis maps a
# command to its npm package; a package without @<version> gets the latest when missing.
agent_clis:
  claude: "@anthropic-ai/claude-code"
  codex: "@openai/codex"
paseo_version: "0.12.0"
# One Orca AppImage in orca_root with the orca-ide wrapper in hades_bin_dir, only while a present
# dev user lists orca. orca_packages are the Electron libraries beyond chrome_packages.
orca_version: "1.4.232"
orca_root: "{{ hades_share }}/orca"
orca_packages: [libnotify4, libsecret-1-0, libxss1, libxtst6, xdg-utils]
host_orca_wanted: "{{ dev_present | selectattr('ades', 'contains', 'orca') | list | length > 0 }}"

# The loopback address the host's Caddy binds, and the one each VM publishes its dev services on.
hades_loopback_address: 127.0.0.1

# Inside the VMs.
orca_terminal_memory_max: 28G
orca_terminal_swap_max: 0
inotify_max_user_instances: 4096
inotify_max_user_watches: 2097152
default_limit_nofile: 1048576
erl_flags: "+sbwt none +sbwtdcpu none +sbwtdio none"

cpu_governor: performance

# Build dependencies for the store's toolchains, plus tools the roles use.
dev_packages:
  - autoconf
  - m4
  - libssl-dev
  - libncurses-dev
  - libxml2-utils
  - xsltproc
  - inotify-tools
  - build-essential
  - git
  - curl
  - unzip
  - jq
  - direnv
  - git-secret
  - gnupg
  - netcat-openbsd
