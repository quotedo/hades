---
# Protected workloads (inventory `protected`): the slice floor, the caps and the private homes.
- name: Read the passwd database
  ansible.builtin.getent:
    database: passwd

- name: Create the drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.d"
    state: directory
    mode: "0755"
  loop: "{{ (['system.slice', 'user.slice'] if protected.floor | default(false) else []) + protected_capped }}"

- name: Write the floor
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.dest }}"
    content: "[Slice]\n{{ item.settings }}\n"
    mode: "0644"
  loop:
    - { dest: system.slice.d/50-hades-floor.conf, settings: "MemoryLow={{ protected_system_memory_low }}\nCPUWeight={{ protected_system_cpu_weight }}" }
    - { dest: user.slice.d/50-hades.conf, settings: "CPUWeight={{ protected_user_slice_cpu_weight }}" }
  loop_control:
    label: "{{ item.dest }}"
  when: protected.floor | default(false)
  notify: daemon-reload

# Named 20-* so an operator's `systemctl set-property` caps (50-*.conf in system.control) still win.
- name: Write the caps
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item }}.d/20-hades-cap.conf"
    content: |
      [{{ item.split('.') | last | capitalize }}]
      CPUWeight={{ capped_cpu_weight }}
      MemoryMax={{ capped_memory_max }}
    mode: "0644"
  loop: "{{ protected_capped }}"
  notify: daemon-reload

- name: Make the private homes 0750
  ansible.builtin.file:
    path: "{{ ansible_facts.getent_passwd[item][4] }}"
    mode: "0750"
  loop: "{{ protected.private_homes | default([]) }}"
