---
- name: Check whether the host exposes a CPU frequency governor
  ansible.builtin.stat:
    path: /sys/devices/system/cpu/cpu0/cpufreq
  register: host_cpufreq

- name: Set the CPU governor
  when: host_cpufreq.stat.exists
  block:
    - name: Write the governor unit
      ansible.builtin.template:
        src: hades-governor.service.j2
        dest: /etc/systemd/system/hades-governor.service
        mode: "0644"
      register: host_governor_unit
      notify: [daemon-reload, governor restart]

    # In check mode a unit file that is about to be written does not exist yet.
    - name: Enable and start the governor unit
      ansible.builtin.systemd_service:
        name: hades-governor.service
        enabled: true
        state: started
      when: not (ansible_check_mode and host_governor_unit is changed)
