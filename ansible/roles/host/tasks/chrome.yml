---
# Chrome for Testing (design 6.4) for the chrome-devtools MCP, from Google's own index.
- name: Install the Chrome runtime libraries and fonts
  ansible.builtin.apt:
    name: "{{ host_chrome_packages }}"
    state: present
    install_recommends: false
  # Keeps Ubuntu's needrestart from restarting services (Docker, Postgres) after an install.
  environment:
    NEEDRESTART_SUSPEND: "1"

# The index names the channel's current build. A newer build is unpacked beside the old one,
# the link moves, and the old build goes; an unpack that stopped half way is removed by hand.
- name: Read the Chrome for Testing index
  ansible.builtin.uri:
    url: https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json
    return_content: true
  register: host_chrome_index
  check_mode: false

- name: Install the channel's Chrome for Testing build
  vars:
    host_chrome_channel: "{{ host_chrome_index.json.channels[chrome_channel | capitalize] }}"
    host_chrome_dir: "{{ chrome_root }}/{{ host_chrome_channel.version }}"
  block:
    - name: Create the Chrome for Testing directory for the build
      ansible.builtin.file:
        path: "{{ host_chrome_dir }}"
        state: directory
        mode: "0755"
      register: host_chrome_dir_created

    - name: Download and unpack Chrome for Testing
      ansible.builtin.unarchive:
        src: "{{ (host_chrome_channel.downloads.chrome | selectattr('platform', 'eq', 'linux64') | first).url }}"
        remote_src: true
        dest: "{{ host_chrome_dir }}"
        creates: "{{ host_chrome_dir }}/chrome-linux64/chrome"
      # In check mode a new build directory does not exist yet.
      when: not (ansible_check_mode and host_chrome_dir_created is changed)

    - name: Link the Chrome binary to its fixed path
      ansible.builtin.file:
        src: "{{ host_chrome_dir }}/chrome-linux64/chrome"
        dest: "{{ chrome_root }}/chrome"
        state: link
        force: true

    # browsers/ is the v1 layout of @puppeteer/browsers.
    - name: Find other Chrome for Testing builds
      ansible.builtin.find:
        paths: "{{ chrome_root }}"
        file_type: directory
        patterns: ['^[0-9.]+$', '^browsers$']
        use_regex: true
        excludes: ['^{{ host_chrome_channel.version | regex_escape }}$']
      register: host_chrome_old

    - name: Remove other Chrome for Testing builds
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ host_chrome_old.files }}"
      loop_control:
        label: "{{ item.path }}"

- name: Find libraries Chrome cannot resolve
  ansible.builtin.shell: set -o pipefail; ldd {{ chrome_root }}/chrome | { grep 'not found' || true; }
  args:
    executable: /bin/bash
  register: host_chrome_ldd
  changed_when: false
  when: not ansible_check_mode

- name: Assert Chrome resolves every library
  ansible.builtin.assert:
    that:
      - host_chrome_ldd.stdout == ''
    fail_msg: >-
      {{ chrome_root }}/chrome lacks libraries; add their packages to host_chrome_packages:
      {{ host_chrome_ldd.stdout_lines | map('trim') | join('; ') }}
    quiet: true
  when: not ansible_check_mode

# Only on hosts that run AppArmor; nothing is installed for it. Loads this one profile and
# touches no other.
- name: Find apparmor_parser
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: [/usr/sbin/apparmor_parser, /sbin/apparmor_parser]
  register: host_apparmor_parsers

- name: Stat the AppArmor profile directory
  ansible.builtin.stat:
    path: /etc/apparmor.d
  register: host_apparmor_dir

- name: Pick the AppArmor parser
  ansible.builtin.set_fact:
    host_apparmor_parser: >-
      {{ (host_apparmor_parsers.results | selectattr('stat.exists') | map(attribute='item') | list + [''])[0] }}

- name: Chrome for Testing AppArmor profile
  when:
    - host_apparmor_parser | length > 0
    - host_apparmor_dir.stat.isdir | default(false)
  block:
    - name: Write the Chrome for Testing AppArmor profile
      ansible.builtin.template:
        src: apparmor-chrome-for-testing.j2
        dest: /etc/apparmor.d/chrome-for-testing
        mode: "0644"
        validate: "{{ host_apparmor_parser }} -Q -K %s"
      register: host_apparmor_profile

    - name: Read the loaded AppArmor profiles
      ansible.builtin.slurp:
        src: /sys/kernel/security/apparmor/profiles
      register: host_apparmor_loaded
      failed_when: false

    # Also repairs a load that failed on an earlier run, when the file itself no longer changes.
    - name: Load the Chrome for Testing AppArmor profile
      ansible.builtin.command: "{{ host_apparmor_parser }} -r -T -W /etc/apparmor.d/chrome-for-testing"
      changed_when: true
      when: >-
        host_apparmor_profile is changed
        or (host_apparmor_loaded.content is defined
            and (host_apparmor_loaded.content | b64decode).splitlines() | select('match', '^chrome-for-testing ') | list | length == 0)
