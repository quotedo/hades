---
- name: Install the host packages
  ansible.builtin.apt:
    name: "{{ dev_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false

- name: Create the share and the Caddy live directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: ["{{ hades_share }}", "{{ hades_bin_dir }}", "{{ hades_live_dir | dirname }}", "{{ hades_live_dir }}"]
  register: host_dirs

- name: Shared tool store
  ansible.builtin.import_tasks: toolchain.yml
  vars:
    # `tool@version` for every tools entry, and for every installed record under the store in
    # host_tools_ls (`mise ls --json`). mise also lists versions a config requests but nobody
    # installed, and root's own installs: neither counts.
    host_tools_listed: >-
      {%- set out = [] -%}
      {%- for tool, versions in tools.items() -%}
      {%- for v in versions -%}
      {%- set _ = out.append(tool ~ '@' ~ v) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out }}
    host_tools_installed: >-
      {%- set out = [] -%}
      {%- for tool, records in (host_tools_ls.stdout | default('{}') | from_json).items() -%}
      {%- for r in records if r.installed and r.install_path.startswith(mise_store ~ '/installs/') -%}
      {%- set _ = out.append(tool ~ '@' ~ r.version) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out }}

- name: Agent CLIs, Paseo and Orca
  ansible.builtin.import_tasks: agents.yml

- name: Chrome for Testing
  ansible.builtin.import_tasks: chrome.yml

- name: Hades CLI and hades-onboard
  ansible.builtin.import_tasks: hades.yml

- name: CPU governor
  ansible.builtin.import_tasks: sysctl.yml

- name: Install hades-keys
  ansible.builtin.template:
    src: hades-keys.sh.j2
    dest: /usr/local/sbin/hades-keys
    mode: "0755"

- name: Write the hades-keys units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop: [hades-keys.service, hades-keys.timer]
  register: host_keys_units
  notify: daemon-reload

- name: Reload systemd before starting the timer
  ansible.builtin.meta: flush_handlers

# In check mode a unit file that is about to be written does not exist yet.
- name: Enable and start the hades-keys timer
  ansible.builtin.systemd_service:
    name: hades-keys.timer
    enabled: true
    state: started
  when: not (ansible_check_mode and host_keys_units is changed)

- name: Incus, its storage pool and bridge
  ansible.builtin.import_tasks: incus.yml

- name: Bridge firewall
  ansible.builtin.import_tasks: firewall.yml

- name: Developer VMs
  ansible.builtin.import_tasks: vms.yml
