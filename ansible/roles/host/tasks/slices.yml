---
- name: Write hades.slice
  ansible.builtin.template:
    src: hades.slice.j2
    dest: /etc/systemd/system/hades.slice
    owner: root
    group: root
    mode: "0644"
  notify: daemon-reload

- name: Create the systemd drop-in directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/systemd/system/user-.slice.d
    - /etc/systemd/system/user@.service.d
    - /etc/systemd/user.conf.d

# Applies to every user-<uid>.slice. The 20- prefix sorts before the 50-<Property>.conf files
# that `systemctl set-property` and per-uid caps write, so those still override these defaults.
- name: Write the per-user slice defaults
  ansible.builtin.template:
    src: user-slice-dropin.conf.j2
    dest: /etc/systemd/system/user-.slice.d/20-hades.conf
    owner: root
    group: root
    mode: "0644"
  notify: daemon-reload

# The user manager's own hard limit must allow DefaultLimitNOFILE for its units. Both take
# effect when a user manager starts; running ones are left alone.
- name: Raise the user manager's file limit
  ansible.builtin.template:
    src: user-service-dropin.conf.j2
    dest: /etc/systemd/system/user@.service.d/50-hades.conf
    owner: root
    group: root
    mode: "0644"
  notify: daemon-reload

- name: Write the user manager defaults
  ansible.builtin.template:
    src: system-user-manager.conf.j2
    dest: /etc/systemd/user.conf.d/50-hades.conf
    owner: root
    group: root
    mode: "0644"
