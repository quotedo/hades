---
- name: Write the kernel settings
  ansible.builtin.template:
    src: sysctl-hades.conf.j2
    dest: /etc/sysctl.d/90-hades.conf
    owner: root
    group: root
    mode: "0644"
  notify: sysctl reload

- name: Check whether the host exposes a CPU frequency governor
  ansible.builtin.stat:
    path: /sys/devices/system/cpu/cpu0/cpufreq
  register: host_cpufreq

- name: Set the CPU governor
  when: host_cpufreq.stat.exists
  block:
    - name: Write the governor unit
      ansible.builtin.template:
        src: hades-governor.service.j2
        dest: /etc/systemd/system/hades-governor.service
        owner: root
        group: root
        mode: "0644"
      register: host_governor_unit
      notify: daemon-reload

    - name: Reload systemd before starting the governor unit
      ansible.builtin.meta: flush_handlers

    - name: Read every CPU's governor
      ansible.builtin.shell: cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor
      register: host_governors
      changed_when: false
      check_mode: false

    # Restart only when some CPU runs another governor, so a second run changes nothing.
    # In check mode a unit file that is about to be written does not exist yet.
    - name: Enable and run the governor unit
      ansible.builtin.systemd_service:
        name: hades-governor.service
        enabled: true
        state: "{{ 'started' if host_governors.stdout_lines | unique == [cpu_governor] else 'restarted' }}"
      when: not (ansible_check_mode and host_governor_unit is changed)
