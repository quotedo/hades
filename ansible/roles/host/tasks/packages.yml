---
- name: Install the host packages
  ansible.builtin.apt:
    name: "{{ host_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
  # Keeps Ubuntu's needrestart from restarting services (Docker, Postgres) after an install.
  environment:
    NEEDRESTART_SUSPEND: "1"
