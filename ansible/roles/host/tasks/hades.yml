---
- name: Read the installed hades version
  ansible.builtin.command: "{{ hades_bin_dir }}/hades version"
  register: host_hades_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install hades from a local build (development)
  ansible.builtin.copy:
    src: "{{ hades_local_binary_dir }}/{{ item }}"
    dest: "{{ hades_bin_dir }}/{{ item }}"
    mode: "0755"
  loop: [hades, hades-port]
  when: hades_local_binary_dir is defined

# The box downloads the public release and checks the archive against its checksums.txt.
- name: Install hades from the release
  when:
    - hades_local_binary_dir is not defined
    - host_hades_installed.rc != 0 or host_hades_installed.stdout != hades_version
  vars:
    host_hades_release: https://github.com/quotedo/hades/releases/download/v{{ hades_version }}
    host_hades_archive: /var/cache/hades_linux_amd64.tar.gz
  block:
    - name: Download the release archive
      ansible.builtin.get_url:
        url: "{{ host_hades_release }}/hades_{{ hades_version }}_linux_amd64.tar.gz"
        checksum: sha256:{{ host_hades_release }}/checksums.txt
        dest: "{{ host_hades_archive }}"
        mode: "0644"
      register: host_hades_download

    # In check mode a new archive is not downloaded.
    - name: Unpack hades and hades-port
      ansible.builtin.unarchive:
        src: "{{ host_hades_archive }}"
        dest: "{{ hades_bin_dir }}"
        remote_src: true
        include: [hades, hades-port]
        owner: root
        group: root
        mode: "0755"
      when: not (ansible_check_mode and host_hades_download is changed)

- name: Install hades-onboard
  ansible.builtin.template:
    src: hades-onboard.sh.j2
    dest: "{{ hades_bin_dir }}/hades-onboard"
    mode: "0755"
