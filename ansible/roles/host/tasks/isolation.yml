---
# Loopback isolation, included by site.yml at the end of the play so that the
# service accounts created by later roles are already present.
#
# The rules live in their own table, inet hades, applied by hades-nftables.service. Nothing here
# enables nftables.service or edits /etc/nftables.conf: a stock /etc/nftables.conf starts with
# `flush ruleset` and would wipe ufw's, Docker's and other tools' rules at boot.
#
# nftables `meta skgid` sees only the socket creator's primary gid, and dev users keep a private
# primary group (hades is supplementary), so "group hades" is matched as an explicit uid set.
- name: Read the local accounts
  ansible.builtin.getent:
    database: passwd

# Accounts that do not exist yet (caddy, cloudflared and hades-postgres before their roles have
# run) are left out, so the rule set changes once when they appear.
- name: Compute the uid and port sets
  ansible.builtin.set_fact:
    host_isolation_dev_uids: "{{ user_present | map(attribute='uid') | map('int') | unique | sort }}"
    host_isolation_service_uids: >-
      {{ ['caddy', 'cloudflared', dev_pg_os_user] | select('in', ansible_facts.getent_passwd)
         | map('extract', ansible_facts.getent_passwd) | map(attribute=1) | map('int') | sort }}
    host_isolation_dev_ports: >-
      {{ ([hades_port_range, dev_pg_port, caddy_port]
          + ([rabbitmq_amqp_port, rabbitmq_management_port, rabbitmq_mqtt_port] if 'rabbitmq' in dev_services else [])
          + ([localstack_port] if 'localstack' in dev_services else [])
          + ([redis_port] if 'redis' in dev_services else [])
          + (user_present | selectattr('paseo_port', 'defined') | map(attribute='paseo_port') | list)
          + (user_present | selectattr('orca_port', 'defined') | map(attribute='orca_port') | list))
         | map('string') | unique | sort }}
    # Orca binds every address; the input chain keeps these to loopback and Tailscale.
    host_isolation_orca_ports: >-
      {{ user_present | selectattr('ades', 'defined') | selectattr('ades', 'contains', 'orca')
         | selectattr('orca_port', 'defined') | map(attribute='orca_port') | map('int') | unique | sort }}
    host_isolation_blocked_ports: >-
      {{ (protected | default({})).blocked_ports | default([]) | map('int') | unique | sort }}

- name: Create /etc/nftables.d
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"

- name: Write the isolation rules
  ansible.builtin.template:
    src: hades-isolation.nft.j2
    dest: /etc/nftables.d/hades.nft
    mode: "0644"
    validate: nft -c -f %s
  notify: hades-nftables reload

- name: Write the isolation unit
  ansible.builtin.template:
    src: hades-nftables.service.j2
    dest: /etc/systemd/system/hades-nftables.service
    mode: "0644"
  register: host_isolation_unit
  notify: daemon-reload

# Reloads systemd and applies changed rules (the reload handler starts an inactive unit).
- name: Apply the isolation rules
  ansible.builtin.meta: flush_handlers

# A changed unit file is restarted so its new commands take effect (a window of milliseconds);
# a rules-only change is applied by the atomic reload above. In check mode a unit file that is
# about to be written does not exist yet.
- name: Enable and start the isolation unit
  ansible.builtin.systemd_service:
    name: hades-nftables.service
    enabled: true
    state: "{{ 'restarted' if host_isolation_unit is changed else 'started' }}"
  when: not (ansible_check_mode and host_isolation_unit is changed)
