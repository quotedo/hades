---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: daemon-reload

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
  listen: sysctl reload

# Reload applies the rule file atomically; on an inactive unit the module starts it instead.
# In check mode the unit may not exist yet.
- name: Reload the isolation rules
  ansible.builtin.systemd_service:
    name: hades-nftables.service
    state: reloaded
  when: not ansible_check_mode
  listen: hades-nftables reload

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted
  listen: journald restart

# Only when the operator opted in (docker_restart_on_change) and Docker is installed. On a fresh
# host the services role installs Docker later and it reads the merged daemon.json at first start.
- name: Restart Docker
  ansible.builtin.systemd_service:
    name: docker.service
    state: restarted
  when:
    - docker_restart_on_change | bool
    - host_dockerd.stat.exists | default(false)
  listen: docker restart

# Loads (or replaces) the one Chrome for Testing profile and refreshes its cache entry.
- name: Load the Chrome for Testing AppArmor profile
  ansible.builtin.command: "{{ host_apparmor_parser }} -r -T -W /etc/apparmor.d/chrome-for-testing"
  changed_when: true
  when: not ansible_check_mode
  listen: chrome apparmor load
