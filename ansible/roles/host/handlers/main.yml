---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: daemon-reload

# Reload applies the rule file atomically; on an inactive unit the module starts it instead.
# In check mode the unit may not exist yet.
- name: Reload the firewall rules
  ansible.builtin.systemd_service:
    name: hades-nftables.service
    state: reloaded
  when: not ansible_check_mode
  listen: hades-nftables reload

# After the daemon-reload above: a changed cpu_governor reaches the CPUs.
- name: Restart the governor unit
  ansible.builtin.systemd_service:
    name: hades-governor.service
    state: restarted
  when: not ansible_check_mode
  listen: governor restart

# sshd -t first: a configuration sshd refuses fails the run before the reload.
- name: Check the sshd configuration
  ansible.builtin.command: sshd -t
  changed_when: false
  listen: sshd reload

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh.service
    state: reloaded
  listen: sshd reload
