---
# gpg_key: true: a key pair without a passphrase, so `git secret reveal` runs unattended, and its
# public key for a project's key holder to `git secret tell`.
- name: GPG key pair, as the developer
  become: true
  become_user: "{{ dev.name }}"
  block:
    - name: Look for the developer's GPG key
      ansible.builtin.command: gpg --list-keys {{ vm_gpg_uid }}
      register: vm_gpg_key
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Generate the developer's GPG key, once
      ansible.builtin.command:
        argv: [gpg, --batch, --pinentry-mode, loopback, --passphrase, "", --quick-gen-key, "{{ vm_gpg_uid }}", default, default, never]
      changed_when: true
      when: vm_gpg_key.rc != 0

    - name: Export the developer's public key
      ansible.builtin.command: gpg --armor --export {{ vm_gpg_uid }}
      register: vm_gpg_public
      changed_when: false
      check_mode: false

- name: Create the public key directory
  ansible.builtin.file:
    path: "{{ hades_config_dir }}/keys"
    state: directory
    mode: "0755"

# In check mode a key that is not generated yet cannot be exported.
- name: Write the developer's public key
  ansible.builtin.copy:
    content: "{{ vm_gpg_public.stdout }}\n"
    dest: "{{ hades_config_dir }}/keys/{{ dev.name }}.asc"
    mode: "0644"
  register: vm_gpg_file
  when: not ansible_check_mode or vm_gpg_key.rc == 0

- name: Show the developer's public key
  ansible.builtin.debug:
    msg: "{{ dev.name }}'s public key, for `git secret tell`, in {{ hades_config_dir }}/keys/{{ dev.name }}.asc:\n{{ vm_gpg_public.stdout }}"
  when: vm_gpg_file is changed and not ansible_check_mode
