---
# The toolchain is the shared store; only the developer's own Hex state is set up here.
- name: Hex, rebar and the private Hex repositories
  when: "'elixir' in tools"
  block:
    - name: Install Hex and rebar
      ansible.builtin.shell: mix local.hex --force && mix local.rebar --force
      args:
        creates: "{{ vm_home }}/.mix/archives/hex-*"
      register: vm_hex

    # In check mode a new Hex is not installed yet, so mix has no hex.repo task.
    - name: List the Hex repositories
      ansible.builtin.command: mix hex.repo list
      register: vm_hex_repos
      changed_when: false
      check_mode: false
      when: hex_repos | length > 0 and not (ansible_check_mode and vm_hex is changed)

    - name: Add the private Hex repositories
      ansible.builtin.command:
        argv:
          - mix
          - hex.repo
          - add
          - "{{ item.name }}"
          - "{{ item.url }}"
          - --auth-key
          - "{{ lookup('env', item.key_env) }}"
          - --fetch-public-key
          - "{{ lookup('env', item.fingerprint_env) }}"
      when: vm_hex_repos is not skipped and vm_hex_repos.stdout is not search('^' ~ item.name ~ '\\s', multiline=True)
      changed_when: true
      no_log: true
      loop: "{{ hex_repos }}"
