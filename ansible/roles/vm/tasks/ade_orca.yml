---
# Run as the developer. The pairing address must be one clients dial over the tailnet: until
# Tailscale is logged in there is no such address, so Orca is skipped with a message.
- name: Read the Tailscale status
  ansible.builtin.command: tailscale status --json
  register: vm_tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Report Orca skipped until Tailscale is logged in
  ansible.builtin.debug:
    msg: "{{ dev.name }}: Orca skipped, Tailscale is not logged in: set TS_AUTHKEY or run tailscale up, then apply again"
  when: (vm_tailscale_status.stdout | default('{}', true) | from_json).BackendState | default('') != 'Running'

- name: Orca, while Tailscale is logged in
  when: (vm_tailscale_status.stdout | default('{}', true) | from_json).BackendState | default('') == 'Running'
  block:
    - name: Read the Tailscale address Orca pairs on
      ansible.builtin.command: tailscale ip -4
      register: vm_tailscale_ip
      changed_when: false
      check_mode: false

    - name: Write the Orca unit
      ansible.builtin.template:
        src: ade.service.j2
        dest: "{{ vm_home }}/.config/systemd/user/orca.service"
        mode: "0644"
      vars:
        ade: orca
      register: vm_orca_unit

    - name: Enable and start Orca, restarting it after a change
      ansible.builtin.systemd_service:
        name: orca.service
        scope: user
        enabled: true
        daemon_reload: "{{ vm_orca_unit is changed }}"
        state: "{{ 'restarted' if vm_orca_unit is changed else 'started' }}"
      # In check mode a new unit is not written yet, so systemd cannot find it.
      when: not (ansible_check_mode and vm_orca_unit is changed)
