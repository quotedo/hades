---
# Provision a dev server.
#
# Interactive one-time steps that no playbook can do for you (docs/server.md):
#   1. Cloudflare: enable Zero Trust once, export CF_ACCOUNT_ID and CF_API_TOKEN and give every
#      present dev user an email; the ingress role creates the tunnel, DNS and Access.
#   2. The administrator's password: `sudo passwd <name>` after the first user apply. Per user,
#      as that user: `gh auth login` and each agent CLI's own login.
#   3. Paseo: enter the daemon password in the desktop client; for a phone run
#      `paseo daemon pair --relay`.
#   4. Tailscale: `tailscale up` once, share the node with each developer; Orca pairs over it.
#   5. A project's key holder runs `git secret tell` for the new users.
- name: Preflight
  ansible.builtin.import_playbook: preflight.yml

- name: Provision dev servers
  hosts: dev_servers
  become: true
  # Shared defaults live in roles/host/defaults/main.yml. Listing the host role makes them
  # visible to every role and task in this play under any tag selection, at role-default
  # precedence. Do not load that file with vars_files: play vars_files outrank inventory host
  # vars, so per-host overrides (hades_version, resource numbers, ...) would be ignored.
  roles:
    - { role: host, tags: [host] }
    - { role: postgres, tags: [postgres] }
    - { role: services, tags: [services], when: dev_services | length > 0 }
    - { role: ingress, tags: [ingress] }
    - { role: user, tags: [user] }
    - { role: protected, tags: [protected], when: protected is defined }
    - { role: vpn, tags: [vpn], when: vpn_enabled }
  tasks:
    # The rule set is derived from every role's outputs (dev users and their ports, service
    # accounts, shared services), so it is recomputed after any tagged run, including tags added
    # later: `always`. `--skip-tags isolation` still leaves it out. Tags on an include select the
    # include only; `apply` gives them to the included tasks.
    - name: Loopback isolation rules
      ansible.builtin.include_role:
        name: host
        tasks_from: isolation
        apply:
          tags: [always, isolation]
      tags: [always, isolation]
