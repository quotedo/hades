---
- name: Read the hades nftables table
  ansible.builtin.command: nft list table inet hades
  become: true
  register: isolation_test_nft
  changed_when: false
  failed_when: false

- name: Assert the table drops the bridge's other input and its bridge-to-bridge forwarding
  ansible.builtin.assert:
    that:
      - isolation_test_nft.rc == 0
      - isolation_test_nft.stdout is search('iifname "' ~ vm_bridge ~ '" counter packets \\d+ bytes \\d+ drop')
      - isolation_test_nft.stdout is search('iifname "' ~ vm_bridge ~ '" oifname "' ~ vm_bridge ~ '" counter packets \\d+ bytes \\d+ drop')
    fail_msg: "table inet hades is missing or lacks the {{ vm_bridge }} drops: {{ isolation_test_nft.stdout }} {{ isolation_test_nft.stderr }}"
    quiet: true

- name: Read the state of the rules unit
  ansible.builtin.systemd_service:
    name: hades-nftables.service
  register: isolation_test_unit

- name: Assert the rules unit is enabled and active, so the rules return on boot
  ansible.builtin.assert:
    that:
      - isolation_test_unit.status.UnitFileState == 'enabled'
      - isolation_test_unit.status.ActiveState == 'active'
    fail_msg: >-
      hades-nftables.service is {{ isolation_test_unit.status.UnitFileState | default('missing') }}
      and {{ isolation_test_unit.status.ActiveState | default('missing') }}
    quiet: true

# Probes run from the last present developer's VM (a) towards the first one's (b), whose SSH the
# box reaches: so a refused connection is the firewall's doing, not a closed port.
- name: Probe the VMs' network from inside
  when: dev_present | length > 0
  become: true
  vars:
    isolation_test_a: "{{ dev_present[-1].name }}"
    isolation_test_b: "{{ dev_present[0].address }}"
    isolation_test_gateway: "{{ vm_subnet | regex_replace('0/16$', '1') }}"
  block:
    - name: Connect from the box to the first VM's SSH
      ansible.builtin.command: nc -z -w 3 {{ isolation_test_b }} 22
      changed_when: false

    - name: Connect from a VM to another VM's SSH and to the host's SSH
      ansible.builtin.command: incus exec {{ isolation_test_a }} -- nc -z -w 3 {{ item }} 22
      register: isolation_test_refused
      changed_when: false
      failed_when: isolation_test_refused.rc == 0
      loop: "{{ ([isolation_test_b] if dev_present | length > 1 else []) + [isolation_test_gateway] }}"

    - name: Resolve and fetch github.com from a VM
      ansible.builtin.command: incus exec {{ isolation_test_a }} -- sh -c 'getent hosts github.com && curl -fsS -o /dev/null https://github.com'
      changed_when: false

    # A VM's root could route to another VM through the host; the forward chain drops it.
    - name: Route from a VM to another VM through the host
      when: dev_present | length > 1
      block:
        - name: Add a route to the other VM through the host
          ansible.builtin.command: incus exec {{ isolation_test_a }} -- ip route add {{ isolation_test_b }}/32 via {{ isolation_test_gateway }}
          changed_when: true

        - name: Connect to the other VM's SSH through the host
          ansible.builtin.command: incus exec {{ isolation_test_a }} -- nc -z -w 3 {{ isolation_test_b }} 22
          register: isolation_test_routed
          changed_when: false
          failed_when: isolation_test_routed.rc == 0
      always:
        - name: Remove the route
          ansible.builtin.command: incus exec {{ isolation_test_a }} -- ip route del {{ isolation_test_b }}/32
          changed_when: true
          failed_when: false
