---
- name: Read the hades nftables table
  ansible.builtin.command: nft list table inet hades
  become: true
  register: host_test_nft
  changed_when: false
  failed_when: false

- name: Assert the table holds the port range bounds and the dev Postgres port
  ansible.builtin.assert:
    that:
      - host_test_nft.rc == 0
      - host_test_nft.stdout is search('\\b' ~ host_test_range[0] ~ '\\b')
      - host_test_nft.stdout is search('\\b' ~ host_test_range[-1] ~ '\\b')
      - host_test_nft.stdout is search('\\b' ~ dev_pg_port ~ '\\b')
    fail_msg: >-
      table inet hades is missing or lacks {{ hades_port_range }} or {{ dev_pg_port }}:
      {{ host_test_nft.stderr | default('') }}
    quiet: true
  vars:
    host_test_range: "{{ hades_port_range | string | split('-') }}"

- name: Read the state of the isolation unit
  ansible.builtin.systemd_service:
    name: hades-nftables.service
  register: host_test_nft_unit

- name: Assert the isolation unit is enabled and active, so the rules return on boot
  ansible.builtin.assert:
    that:
      - host_test_nft_unit.status.UnitFileState == 'enabled'
      - host_test_nft_unit.status.ActiveState == 'active'
    fail_msg: >-
      hades-nftables.service is {{ host_test_nft_unit.status.UnitFileState | default('missing') }}
      and {{ host_test_nft_unit.status.ActiveState | default('missing') }}
    quiet: true

# `nc -z` cannot tell a reject from a closed port, so the test runs its own root listener on a
# port of the range that nothing listens on and no worktree has claimed.
- name: Probe loopback isolation as a non-dev account
  become: true
  vars:
    host_test_probe_unit: hades-probe-listener.service
    host_test_probe_port: "{{ host_test_probe_pick.stdout }}"
  block:
    - name: Pick a free, unclaimed port of the range
      ansible.builtin.shell: |
        set -o pipefail
        for port in $(seq {{ (hades_port_range | split('-'))[0] | int }} {{ (hades_port_range | split('-'))[1] | int }}); do
          claim={{ (hades_registry_root ~ '/ports') | quote }}/$port
          if [ -e "$claim" ] || [ -L "$claim" ]; then continue; fi
          if [ -n "$(ss -Hltn "sport = :$port")" ]; then continue; fi
          echo "$port"
          exit 0
        done
        exit 1
      args:
        executable: /bin/bash
      register: host_test_probe_pick
      changed_when: false
      failed_when: false

    - name: Assert a probe port was found
      ansible.builtin.assert:
        that:
          - host_test_probe_pick.rc == 0
        fail_msg: "every port of {{ hades_port_range }} is listening or claimed; the probe has no port to listen on"
        quiet: true

    - name: Start a root listener on the probe port
      ansible.builtin.command: >-
        systemd-run --unit={{ host_test_probe_unit }} --collect
        nc -dlk {{ host_loopback_address }} {{ host_test_probe_port }}
      changed_when: true

    - name: Wait for the listener
      ansible.builtin.wait_for:
        host: "{{ host_loopback_address }}"
        port: "{{ host_test_probe_port | int }}"
        timeout: 10

    # Vacuous until the postgres role runs: nothing listens on dev_pg_port before that, so the
    # listener probe below carries the real check.
    - name: Connect to the dev Postgres port as the probe account
      ansible.builtin.command: runuser -u {{ host_test_unprivileged_user }} -- nc -z -w 3 {{ dev_pg_host }} {{ dev_pg_port }}
      register: host_test_probe_pg
      changed_when: false
      failed_when: false

    - name: Connect to the listener as the probe account
      ansible.builtin.command: runuser -u {{ host_test_unprivileged_user }} -- nc -z -w 3 {{ host_loopback_address }} {{ host_test_probe_port }}
      register: host_test_probe_dev
      changed_when: false
      failed_when: false

    - name: Connect to the listener as root
      ansible.builtin.command: nc -z -w 3 {{ host_loopback_address }} {{ host_test_probe_port }}
      register: host_test_probe_root
      changed_when: false
      failed_when: false

    - name: Connect to ssh as the probe account
      ansible.builtin.command: runuser -u {{ host_test_unprivileged_user }} -- nc -z -w 3 {{ host_loopback_address }} {{ host_test_ssh_port }}
      register: host_test_probe_ssh
      changed_when: false
      failed_when: false

    - name: Assert the dev ports refuse the probe account and nothing else changed
      ansible.builtin.assert:
        that:
          - host_test_probe_pg.rc != 0
          - host_test_probe_dev.rc != 0
          - host_test_probe_root.rc == 0
          - host_test_probe_ssh.rc == 0
        fail_msg: >-
          probe results (0 = connected): dev Postgres {{ host_test_probe_pg.rc }} (expected refused),
          port {{ host_test_probe_port }} on loopback {{ host_test_probe_dev.rc }} (expected refused),
          as root {{ host_test_probe_root.rc }} (expected 0), ssh {{ host_test_probe_ssh.rc }} (expected 0)
        quiet: true

  always:
    - name: Stop the listener
      ansible.builtin.systemd_service:
        name: "{{ host_test_probe_unit }}"
        state: stopped
      failed_when: false
