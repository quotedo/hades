---
# Per present dev user and listed ADE. Root may reach every dev port through loopback isolation,
# so the probes run as root. ade_test_pairs is every (user, ADE) the inventory lists.
- name: Read the Tailscale address Orca pairs on
  ansible.builtin.command: tailscale ip -4
  register: ade_test_tailscale_ip
  changed_when: false
  when: ade_test_pairs | map(attribute='1') is contains('orca')
  vars:
    ade_test_pairs: "{{ user_present | subelements('ades', skip_missing=True) }}"

- name: Read each listed ADE unit's state
  ansible.builtin.command: systemctl --user -M {{ item.0.name }}@ show {{ item.1 }}.service -p ActiveState -p UnitFileState # noqa: command-instead-of-module
  become: true
  register: ade_test_unit
  changed_when: false
  failed_when: false
  loop: "{{ user_present | subelements('ades', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}"

- name: Read each listed ADE's listeners
  ansible.builtin.command: ss -Hltnpe 'sport = :{{ item.0[item.1 ~ '_port'] }}'
  become: true
  register: ade_test_ss
  changed_when: false
  loop: "{{ user_present | subelements('ades', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}"

# Paseo's node process renames itself "Paseo Daemon", so ownership is matched on uid and cgroup.
- name: Assert each listed ADE runs enabled, from its user's unit, on its address only
  ansible.builtin.assert:
    that:
      - "'ActiveState=active' in ade_test_unit.results[i].stdout_lines"
      - "'UnitFileState=enabled' in ade_test_unit.results[i].stdout_lines"
      - ade_test_listeners | length > 0
      - ade_test_listeners | reject('search', '\\s' ~ (ade_test_address | regex_escape) ~ ':' ~ item.0[item.1 ~ '_port'] ~ '\\s') | list == []
      - ade_test_listeners | reject('search', '\\buid:' ~ item.0.uid ~ '\\b') | list == []
      - ade_test_listeners | reject('search', '/user@' ~ item.0.uid ~ '\\.service/app\\.slice/' ~ item.1 ~ '\\.service\\b') | list == []
    fail_msg: |-
      {{ item.0.name }} {{ item.1 }}: {{ ade_test_unit.results[i].stdout_lines | join(', ') }}
      expected listeners on {{ ade_test_address }}:{{ item.0[item.1 ~ '_port'] }} from uid {{ item.0.uid }}'s {{ item.1 }}.service:
      {{ ade_test_listeners | join('\n') or 'none' }}
    quiet: true
  loop: "{{ user_present | subelements('ades', skip_missing=True) }}"
  loop_control:
    index_var: i
    label: "{{ item.0.name }} {{ item.1 }}"
  vars:
    ade_test_listeners: "{{ ade_test_ss.results[i].stdout_lines }}"
    ade_test_address: "{{ host_loopback_address if item.1 == 'paseo' else ade_test_tailscale_ip.stdout }}"

# One curl for both status codes; uri would need a request each.
- name: Request Paseo's health and, without a token, its agents # noqa: command-instead-of-module
  ansible.builtin.command: >-
    curl -s -w '%{http_code}\n'
    -o /dev/null http://{{ host_loopback_address }}:{{ item.paseo_port }}/api/health
    -o /dev/null http://{{ host_loopback_address }}:{{ item.paseo_port }}/api/agents
  become: true
  register: ade_test_paseo_http
  changed_when: false
  failed_when: false
  loop: "{{ user_present | selectattr('ades', 'defined') | selectattr('ades', 'contains', 'paseo') }}"
  loop_control:
    label: "{{ item.name }}"

- name: Read each Paseo environment file
  ansible.builtin.stat:
    path: "{{ user_home_base }}/{{ item.name }}/.config/hades/paseo.env"
  become: true
  register: ade_test_paseo_env
  loop: "{{ user_present | selectattr('ades', 'defined') | selectattr('ades', 'contains', 'paseo') }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert Paseo answers health openly, refuses anonymous requests and keeps its password private
  ansible.builtin.assert:
    that:
      - ade_test_paseo_http.results[i].stdout_lines == ['200', '401']
      - ade_test_paseo_env.results[i].stat.exists
      - ade_test_paseo_env.results[i].stat.mode == '0600'
      - ade_test_paseo_env.results[i].stat.pw_name == item.name
    fail_msg: >-
      {{ item.name }}: health, agents = {{ ade_test_paseo_http.results[i].stdout_lines | join(', ') }} (want 200, 401);
      paseo.env {{ ade_test_paseo_env.results[i].stat.mode | default('missing') }}
      {{ ade_test_paseo_env.results[i].stat.pw_name | default('') }} (want 0600 {{ item.name }})
    quiet: true
  loop: "{{ user_present | selectattr('ades', 'defined') | selectattr('ades', 'contains', 'paseo') }}"
  loop_control:
    index_var: i
    label: "{{ item.name }}"

- name: Look for every ADE unit file of each present user
  ansible.builtin.stat:
    path: "{{ user_home_base }}/{{ item.0.name }}/.config/systemd/user/{{ item.1 }}.service"
  become: true
  register: ade_test_unit_file
  loop: "{{ user_present | product(['paseo', 'orca']) }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}"

- name: Assert an ADE unit exists exactly for the ADEs a user lists
  ansible.builtin.assert:
    that:
      - ade_test_unit_file.results[i].stat.exists == (item.1 in item.0.ades | default([]))
    fail_msg: >-
      {{ item.0.name }} lists {{ item.0.ades | default([]) }}, but {{ item.1 }}.service
      {{ 'exists' if ade_test_unit_file.results[i].stat.exists else 'is missing' }}
    quiet: true
  loop: "{{ user_present | product(['paseo', 'orca']) }}"
  loop_control:
    index_var: i
    label: "{{ item.0.name }} {{ item.1 }}"
