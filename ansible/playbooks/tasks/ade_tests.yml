---
# One developer's VM, as root inside it: a unit exactly for each ADE the developer lists, Paseo
# running and answering on its port, Orca enabled (it starts once Tailscale is logged in).
- name: Read the ADE units # noqa: command-instead-of-module
  ansible.builtin.command: systemctl --user -M {{ dev.name }}@ show {{ item }}.service -p LoadState -p ActiveState -p UnitFileState
  register: ade_test_units
  changed_when: false
  loop: [paseo, orca]

- name: Assert each listed ADE's unit is enabled, Paseo's active, and an unlisted one has none
  ansible.builtin.assert:
    that: >-
      item.stdout_lines is superset(['UnitFileState=enabled'] + (['ActiveState=active'] if item.item == 'paseo' else []))
      if item.item in dev.ades else 'LoadState=not-found' in item.stdout_lines
    fail_msg: "{{ dev.name }} lists {{ dev.ades }}; {{ item.item }}.service: {{ item.stdout_lines | join(', ') }}"
    quiet: true
  loop: "{{ ade_test_units.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Check Paseo
  when: "'paseo' in dev.ades"
  block:
    # One curl for both status codes; uri would need a request each.
    - name: Request Paseo's health and, without a token, its agents # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl -s -w '%{http_code}\n'
        -o /dev/null http://{{ hades_loopback_address }}:6767/api/health
        -o /dev/null http://{{ hades_loopback_address }}:6767/api/agents
      register: ade_test_paseo_http
      changed_when: false
      failed_when: false
      # Paseo may still be starting after a restart.
      until: ade_test_paseo_http.stdout_lines == ['200', '401']
      retries: 10
      delay: 3

    - name: Stat Paseo's password file
      ansible.builtin.stat:
        path: "{{ vm_home }}/.config/hades/paseo.env"
      register: ade_test_paseo_env

    - name: Assert Paseo answers health openly, refuses anonymous requests and keeps its password private
      ansible.builtin.assert:
        that:
          - ade_test_paseo_http.stdout_lines == ['200', '401']
          - ade_test_paseo_env.stat.mode | default('') == '0600'
          - ade_test_paseo_env.stat.pw_name | default('') == dev.name
        fail_msg: >-
          {{ dev.name }}: health, agents = {{ ade_test_paseo_http.stdout_lines | join(', ') }} (want 200, 401);
          paseo.env {{ ade_test_paseo_env.stat.mode | default('missing') }} {{ ade_test_paseo_env.stat.pw_name | default('') }}
          (want 0600 {{ dev.name }})
        quiet: true
