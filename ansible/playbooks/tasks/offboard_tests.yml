---
# Each absent developer: the newest offboard archive (names sort by time) is root's, 0600, and holds
# their home; their VM, jump keys and developer list line are gone. Prints the archive's owner and
# mode, `archived`, then whatever is left.
- name: Look for each absent developer's archive and for what they left
  ansible.builtin.shell: >-
    for f in {{ backup_dir }}/{{ item.name }}-offboard-*.tar.gz; do :; done;
    stat -c '%U %a' "$f" && tar -tzf "$f" {{ item.name }}/ > /dev/null && echo archived;
    incus info {{ item.name }} > /dev/null 2>&1 && echo instance {{ item.name }};
    grep -F 'permitopen="{{ item.address }}:22"' /var/lib/hades-jump/.ssh/authorized_keys;
    grep '^{{ item.name }}:' {{ hades_config_dir }}/github-logins; true
  become: true
  register: offboard_test_left
  changed_when: false
  loop: "{{ dev_absent }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert each absent developer's home is archived and nothing else is left
  ansible.builtin.assert:
    that: item.stdout_lines == ['root 600', 'archived']
    fail_msg: "{{ item.item.name }}: {{ item.stdout_lines }} {{ item.stderr }}"
    quiet: true
  loop: "{{ offboard_test_left.results }}"
  loop_control:
    label: "{{ item.item.name }}"
