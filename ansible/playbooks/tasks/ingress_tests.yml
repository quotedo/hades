---
- name: Read Caddy's unit
  ansible.builtin.systemd_service:
    name: caddy.service
  register: ingress_test_caddy

- name: Assert Caddy is active
  ansible.builtin.assert:
    that: ingress_test_caddy.status.ActiveState | default('missing') == 'active'
    fail_msg: "caddy.service is {{ ingress_test_caddy.status.ActiveState | default('missing') }}, expected active"
    quiet: true

- name: Read the listening TCP sockets with their processes
  ansible.builtin.command: ss -Hltnp
  become: true
  register: ingress_test_ss
  changed_when: false

# Every caddy_port listener is on the loopback address, Caddy listens nowhere else (no 80/443),
# and nothing holds Caddy's default API port: there is no API.
- name: Assert Caddy listens on the loopback caddy_port only
  ansible.builtin.assert:
    that:
      - ingress_test_port_lines | length > 0
      - ingress_test_port_lines | reject('search', ingress_test_bind) | list | length == 0
      - ingress_test_ss.stdout_lines | select('search', '"caddy"') | reject('search', ingress_test_bind) | list | length == 0
      - ingress_test_ss.stdout_lines | select('search', ':2019 ') | list | length == 0
    fail_msg: >-
      listeners: {{ ingress_test_ss.stdout_lines | select('search', ':(' ~ caddy_port ~ '|2019) |"caddy"')
                    | join(' | ') or 'none' }}
    quiet: true
  vars:
    ingress_test_bind: " {{ hades_loopback_address | regex_escape }}:{{ caddy_port }} "
    ingress_test_port_lines: "{{ ingress_test_ss.stdout_lines | select('search', ':' ~ caddy_port ~ ' ') | list }}"

# Through the host's Caddy: unknown names, the plain one and each developer's (which their VM's
# Caddy answers), redirect to the apex.
- name: Request unknown names through Caddy
  ansible.builtin.uri:
    url: http://{{ hades_loopback_address }}:{{ caddy_port }}/
    headers:
      Host: "{{ item }}.{{ hades_domain }}"
    status_code: 302
    follow_redirects: none
  register: ingress_test_unknown
  loop: "{{ ['nothing'] + dev_present | map(attribute='name') | product(['-nothing']) | map('join') | list }}"

- name: Assert unknown names redirect to the apex
  ansible.builtin.assert:
    that: ingress_test_unknown.results | map(attribute='location') | unique == ['https://' ~ hades_domain]
    fail_msg: "Location: {{ ingress_test_unknown.results | map(attribute='location') | unique }}"
    quiet: true

- name: Assert a gated path without the Access header is refused
  ansible.builtin.uri:
    url: http://{{ hades_loopback_address }}:{{ caddy_port }}/dev/x
    headers:
      Host: nothing.{{ hades_domain }}
    status_code: 403

# The VM's 302 looks like the host's own, so each VM's Caddy stops for one request: a 502 shows
# the host sent that developer's names to that VM.
- name: Request each developer's names with their VM's Caddy stopped
  ansible.builtin.shell: >-
    incus exec {{ item.name }} -- systemctl stop caddy;
    curl -s -o /dev/null -w '%{http_code}' -H 'Host: {{ item.name }}-nothing.{{ hades_domain }}'
    http://{{ hades_loopback_address }}:{{ caddy_port }}/;
    incus exec {{ item.name }} -- systemctl start caddy
  become: true
  register: ingress_test_stopped
  changed_when: false
  failed_when: ingress_test_stopped.rc != 0 or ingress_test_stopped.stdout != '502'
  loop: "{{ dev_present }}"
  loop_control:
    label: "{{ item.name }}"

# Skipped without Cloudflare credentials unless the tag is requested: a host with no zone runs no
# tunnel.
- name: Check the tunnel connector and Cloudflare Access
  when: lookup('ansible.builtin.env', 'CF_API_TOKEN') | length > 0 or 'cloudflared' in ansible_run_tags
  tags: [cloudflared]
  block:
    - name: Read cloudflared's unit
      ansible.builtin.systemd_service:
        name: cloudflared.service
      register: ingress_test_cloudflared

    - name: Assert cloudflared is active
      ansible.builtin.assert:
        that:
          - ingress_test_cloudflared.status.ActiveState | default('missing') == 'active'
        fail_msg: "cloudflared.service is {{ ingress_test_cloudflared.status.ActiveState | default('missing') }}"
        quiet: true

    # Through the edge: Access must answer before the request reaches the tunnel.
    - name: Request an unknown label through Cloudflare
      ansible.builtin.uri:
        url: https://probe-{{ 999999999 | random }}.{{ hades_domain }}/
        follow_redirects: none
        status_code: 302
      delegate_to: localhost
      become: false
      register: ingress_test_edge

    - name: Read the Access organization
      ansible.builtin.uri:
        url: "{{ ingress_cloudflare_api }}/accounts/{{ lookup('ansible.builtin.env', 'CF_ACCOUNT_ID') }}/access/organizations"
        headers:
          Authorization: Bearer {{ lookup('ansible.builtin.env', 'CF_API_TOKEN') }}
      delegate_to: localhost
      become: false
      register: ingress_test_org
      no_log: true

    - name: Assert Cloudflare Access redirects to the team domain
      ansible.builtin.assert:
        that: ingress_test_edge.location.startswith('https://' ~ ingress_test_org.json.result.auth_domain ~ '/')
        fail_msg: "edge Location is {{ ingress_test_edge.location }}"
        quiet: true

    - name: Read the Access application
      ansible.builtin.uri:
        url: "{{ ingress_cloudflare_api }}/accounts/{{ lookup('ansible.builtin.env', 'CF_ACCOUNT_ID') }}/access/apps?domain=*.{{ hades_domain }}"
        headers:
          Authorization: Bearer {{ lookup('ansible.builtin.env', 'CF_API_TOKEN') }}
      delegate_to: localhost
      become: false
      register: ingress_test_apps
      no_log: true

    - name: Assert the Access policy admits exactly the inventory's list
      ansible.builtin.assert:
        that:
          - ingress_test_policies | length == 1
          - ingress_test_policies[0].include | symmetric_difference(ingress_access_include) == []
        fail_msg: >-
          Access policies {{ ingress_test_policies | map(attribute='include') | to_json }},
          inventory {{ ingress_access_include | to_json }}
        quiet: true
      vars:
        ingress_test_policies: >-
          {{ ingress_test_apps.json.result | selectattr('domain', 'eq', '*.' ~ hades_domain)
             | map(attribute='policies') | flatten }}
