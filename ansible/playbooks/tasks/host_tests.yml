---
- name: Group hades exists
  ansible.builtin.getent:
    database: group
    key: "{{ hades_group }}"

- name: Stat the registry directories
  ansible.builtin.stat:
    path: "{{ hades_registry_root }}/{{ item }}"
  loop: [ports, sites, manifests]
  register: host_test_registry

- name: Assert the registry directories are root:hades 3775
  ansible.builtin.assert:
    that:
      - item.stat.isdir
      - item.stat.mode == '3775'
      - item.stat.pw_name == 'root'
      - item.stat.gr_name == hades_group
    fail_msg: "{{ item.item }}: expected a root:{{ hades_group }} directory with mode 3775"
    quiet: true
  loop: "{{ host_test_registry.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Stat the Caddy live directory
  ansible.builtin.stat:
    path: "{{ hades_live_dir }}"
  register: host_test_live_dir

- name: Assert the Caddy live directory is root 0755
  ansible.builtin.assert:
    that:
      - host_test_live_dir.stat.isdir
      - host_test_live_dir.stat.mode == '0755'
      - host_test_live_dir.stat.pw_name == 'root'
    fail_msg: "{{ hades_live_dir }} must be a root-owned directory with mode 0755"
    quiet: true

- name: Read the installed hades version
  ansible.builtin.command: "{{ hades_bin_dir }}/hades version"
  register: host_test_version
  changed_when: false

- name: Stat hades-port
  ansible.builtin.stat:
    path: "{{ hades_bin_dir }}/hades-port"
  register: host_test_hades_port

- name: Assert hades is the pinned version and hades-port is installed
  ansible.builtin.assert:
    that:
      - host_test_version.stdout == hades_version
      - host_test_hades_port.stat.exists
      - host_test_hades_port.stat.mode == '0755'
      - host_test_hades_port.stat.pw_name == 'root'
    fail_msg: "hades reports {{ host_test_version.stdout }}, expected {{ hades_version }}; hades-port must be root 0755"
    quiet: true

- name: Stat the host config
  ansible.builtin.stat:
    path: "{{ hades_config_dir }}/host.toml"
  register: host_test_config_stat

- name: Read the host config
  ansible.builtin.slurp:
    src: "{{ hades_config_dir }}/host.toml"
  register: host_test_config
  when: host_test_config_stat.stat.exists

- name: Assert the host config is root 0644 with the contracted values
  ansible.builtin.assert:
    that:
      - host_test_config_stat.stat.exists
      - host_test_config_stat.stat.mode == '0644'
      - host_test_config_stat.stat.pw_name == 'root'
      - ('domain = "' ~ hades_domain ~ '"') in host_test_config_text
      - ('live_dir = "' ~ hades_live_dir ~ '"') in host_test_config_text
      - ('port = ' ~ dev_pg_port) in host_test_config_text
    fail_msg: "{{ hades_config_dir }}/host.toml is missing, has the wrong mode or owner, or lacks domain, live_dir or the Postgres port"
    quiet: true
  vars:
    host_test_config_text: "{{ host_test_config.content | default('') | b64decode }}"

- name: Validate the sudoers rule
  ansible.builtin.command: visudo -cf /etc/sudoers.d/hades
  become: true
  changed_when: false

- name: Read the sudoers rule
  ansible.builtin.slurp:
    src: /etc/sudoers.d/hades
  become: true
  register: host_test_sudoers

- name: Assert the sudoers rule allows exactly caddy-reload and keeps no environment
  ansible.builtin.assert:
    that:
      - host_test_rule in host_test_sudoers_lines
      - host_test_sudoers_lines | reject('match', '^#') | reject('equalto', '') | list == [host_test_rule]
    fail_msg: "/etc/sudoers.d/hades must hold exactly: {{ host_test_rule }}"
    quiet: true
  vars:
    host_test_sudoers_lines: "{{ (host_test_sudoers.content | b64decode).splitlines() }}"
    host_test_rule: >-
      %{{ hades_group }} ALL=(root) NOPASSWD: {{ hades_bin_dir }}/hades caddy-reload,
      {{ hades_bin_dir }}/hades caddy-reload --check

- name: Read the kernel settings
  ansible.builtin.command: sysctl -n vm.swappiness fs.inotify.max_user_instances fs.inotify.max_user_watches
  register: host_test_sysctl
  changed_when: false

- name: Assert the kernel settings
  ansible.builtin.assert:
    that:
      - host_test_sysctl.stdout_lines[0] | int == vm_swappiness | int
      - host_test_sysctl.stdout_lines[1] | int == inotify_max_user_instances | int
      - host_test_sysctl.stdout_lines[2] | int == inotify_max_user_watches | int
    fail_msg: "sysctl reports {{ host_test_sysctl.stdout_lines | join(', ') }}"
    quiet: true

- name: Read the hades.slice properties
  ansible.builtin.systemd_service:
    name: hades.slice
  register: host_test_slice

- name: Assert the hades.slice memory limit
  ansible.builtin.assert:
    that:
      - host_test_slice.status.MemoryMax == host_test_expected
    fail_msg: "hades.slice MemoryMax is {{ host_test_slice.status.MemoryMax }}, expected {{ host_test_expected }}"
    quiet: true
  vars:
    host_test_expected: >-
      {{ 'infinity' if hades_slice_memory_max == 'infinity' else (hades_slice_memory_max | human_to_bytes | string) }}

# Caps an operator set with `systemctl set-property` on user slices must stay effective:
# nothing this collection writes may sort after and override them.
- name: Find set-property drop-ins on user slices
  ansible.builtin.find:
    paths: /etc/systemd/system.control
    patterns: "*.conf"
    recurse: true
  register: host_test_control

- name: Read the set-property drop-ins on user slices
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ host_test_control.files | selectattr('path', 'search', '/user-[0-9]+\\.slice\\.d/') | sort(attribute='path') }}"
  loop_control:
    label: "{{ item.path }}"
  register: host_test_control_files

# Per slice, the last value in filename order wins, as in systemd. Only absolute values are
# compared, since `systemctl show` reports bytes and not percentages.
- name: Collect the set-property CPUWeight and MemoryMax per user slice
  ansible.builtin.set_fact:
    host_test_caps: >-
      {%- set ns = namespace(caps={}) -%}
      {%- for f in host_test_control_files.results -%}
      {%- set unit = f.item.path | dirname | basename | regex_replace('\.d$', '') -%}
      {%- for line in (f.content | b64decode).splitlines() -%}
      {%- set m = line | regex_search('^(CPUWeight|MemoryMax)=([0-9]+|infinity)$', '\\1', '\\2') -%}
      {%- if m -%}
      {%- set _ = ns.caps.update({unit: ns.caps.get(unit, {}) | combine({m[0]: m[1]})}) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ ns.caps }}

- name: Read the capped user slices
  ansible.builtin.systemd_service:
    name: "{{ item }}"
  loop: "{{ host_test_caps.keys() | list }}"
  register: host_test_capped

- name: Assert the set-property caps on user slices are effective
  ansible.builtin.assert:
    that:
      - host_test_mismatches | length == 0
    fail_msg: "user slice caps overridden: {{ host_test_mismatches | join('; ') }}"
    quiet: true
  vars:
    host_test_mismatches: >-
      {%- set out = [] -%}
      {%- for r in host_test_capped.results -%}
      {%- for k, v in host_test_caps[r.item].items() if r.status[k] != v -%}
      {%- set _ = out.append(r.item ~ ' ' ~ k ~ '=' ~ r.status[k] ~ ', set-property says ' ~ v) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out }}

- name: Check whether the host exposes a CPU frequency governor
  ansible.builtin.stat:
    path: /sys/devices/system/cpu/cpu0/cpufreq
  register: host_test_cpufreq

- name: Read every CPU's governor
  ansible.builtin.shell: cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor
  register: host_test_governors
  changed_when: false
  when: host_test_cpufreq.stat.exists

- name: Assert every CPU runs the configured governor
  ansible.builtin.assert:
    that:
      - host_test_governors.stdout_lines | unique == [cpu_governor]
    fail_msg: "governors in use: {{ host_test_governors.stdout_lines | unique | join(', ') }}"
    quiet: true
  when: host_test_cpufreq.stat.exists

- name: Read the tool installs
  ansible.builtin.command: mise ls --json
  become: true
  register: host_tools_ls
  changed_when: false

- name: Assert the store holds exactly the tools versions
  ansible.builtin.assert:
    that:
      - host_tools_installed | sort == host_tools_listed | sort
    fail_msg: "the store holds {{ host_tools_installed | sort }}, tools lists {{ host_tools_listed | sort }}"
    quiet: true

- name: Stat the shims directory
  ansible.builtin.stat:
    path: "{{ mise_shims }}"
  register: host_test_shims

- name: Assert the shims directory exists and is root 0755
  ansible.builtin.assert:
    that:
      - host_test_shims.stat.isdir | default(false)
      - host_test_shims.stat.mode == '0755'
      - host_test_shims.stat.pw_name == 'root'
    fail_msg: "{{ mise_shims }} must be a root-owned directory with mode 0755"
    quiet: true

- name: Read the system mise config
  ansible.builtin.slurp:
    src: /etc/mise/config.toml
  register: host_test_mise_config

# Without these a shim auto-installs a missing project version or silently runs another binary.
- name: Assert the system config disables auto-install and fall-through
  ansible.builtin.assert:
    that:
      - "'auto_install = false' in host_test_mise_config_lines"
      - "'not_found_system_fallback = false' in host_test_mise_config_lines"
    fail_msg: /etc/mise/config.toml must set auto_install = false and not_found_system_fallback = false
    quiet: true
  vars:
    host_test_mise_config_lines: "{{ (host_test_mise_config.content | b64decode).splitlines() }}"

# `mise which` names the binary behind a shim (the shims themselves link to mise).
- name: Read the global CLI versions
  ansible.builtin.shell: set -e; mise which {{ item }}; {{ mise_shims }}/{{ item }} --version
  loop: [claude, codex, paseo]
  register: host_test_clis
  changed_when: false
  failed_when: false

- name: Assert the agent CLIs and Paseo are installed in the store
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout_lines[0].startswith(mise_store ~ '/installs/node/' ~ tools.node[0] ~ '/bin/')
      - item.item != 'paseo' or paseo_version in item.stdout
    fail_msg: "{{ item.item }} must run from the default Node in the store ({{ paseo_version }} for paseo): {{ item.stdout }} {{ item.stderr }}"
    quiet: true
  loop: "{{ host_test_clis.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Stat Orca and its wrapper
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: ["{{ orca_root }}/orca-{{ orca_version }}.AppImage", /usr/local/bin/orca-ide]
  register: host_test_orca
  when: host_orca_wanted

- name: Assert Orca is the pinned version and its wrapper is executable
  ansible.builtin.assert:
    that:
      - host_test_orca.results | map(attribute='stat.mode', default='') | unique == ['0755']
    fail_msg: "{{ orca_root }}/orca-{{ orca_version }}.AppImage and /usr/local/bin/orca-ide must exist with mode 0755"
    quiet: true
  when: host_orca_wanted

- name: Stat hades-keys and hades-onboard
  ansible.builtin.stat:
    path: "{{ hades_bin_dir }}/{{ item }}"
  loop: [hades-keys, hades-onboard]
  register: host_test_scripts

- name: Assert hades-keys and hades-onboard are root 0755
  ansible.builtin.assert:
    that:
      - item.stat.mode | default('') == '0755'
      - item.stat.pw_name == 'root'
    fail_msg: "{{ hades_bin_dir }}/{{ item.item }} must exist, root-owned with mode 0755"
    quiet: true
  loop: "{{ host_test_scripts.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read the hades-keys timer
  ansible.builtin.systemd_service:
    name: hades-keys.timer
  register: host_test_keys_timer

- name: Assert the hades-keys timer is enabled and active
  ansible.builtin.assert:
    that:
      - host_test_keys_timer.status.UnitFileState | default('') == 'enabled'
      - host_test_keys_timer.status.ActiveState | default('') == 'active'
    fail_msg: "hades-keys.timer must be enabled and active"
    quiet: true

# Review focus: a fetch that fails says so and writes nothing; hades-keys fetches before it
# looks at any home.
- name: Probe hades-keys with a GitHub login that does not exist
  become: true
  block:
    - name: Create the probe login list
      ansible.builtin.tempfile:
        state: file
      register: host_test_keys_list

    - name: Write the probe login list
      ansible.builtin.copy:
        content: "nouser:this-login-does-not-exist-404\n"
        dest: "{{ host_test_keys_list.path }}"
        mode: "0600"

    - name: Run hades-keys against the probe list
      ansible.builtin.command: "{{ hades_bin_dir }}/hades-keys"
      environment:
        HADES_KEYS_FILE: "{{ host_test_keys_list.path }}"
      register: host_test_keys_run
      changed_when: false

    - name: Assert the failed fetch kept authorized_keys
      ansible.builtin.assert:
        that: "host_test_keys_run.stdout_lines == ['nouser: fetch failed, kept']"
        fail_msg: "hades-keys printed {{ host_test_keys_run.stdout_lines }}"
        quiet: true
  always:
    - name: Remove the probe login list
      ansible.builtin.file:
        path: "{{ host_test_keys_list.path }}"
        state: absent
