---
# Adds every present developer's VM of every box to group dev_vms as <name>.<box>: root at the
# VM's address through the box (ProxyJump as the box's ansible_user), with the box's inventory
# variables, `hades_box` and `dev` (its dev_present entry). Plays on dev_vms list the host role
# for its defaults.
- name: Pair the box with its present developers
  ansible.builtin.set_fact:
    vm_hosts_pairs: "{{ [inventory_hostname] | product(dev_present) }}"

- name: Add the VMs
  ansible.builtin.add_host:
    name: "{{ item.1.name }}.{{ item.0 }}"
    groups: dev_vms
    ansible_host: "{{ item.1.address }}"
    ansible_user: root
    ansible_ssh_common_args: >-
      -o ProxyJump={{ hostvars[item.0].ansible_user }}@{{ hostvars[item.0].ansible_host }}
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    hades_box: "{{ item.0 }}"
    dev: "{{ item.1 }}"
  changed_when: false
  # The box's variables without Ansible's own and its facts.
  args: "{{ dict(vm_hosts_keys | zip(vm_hosts_keys | map('extract', hostvars[item.0]))) }}"
  vars:
    vm_hosts_keys: >-
      {{ hostvars[item.0].keys() | reject('match', '^(ansible_|inventory_|group|hostvars|omit|play|role)')
         | reject('in', hostvars[item.0].ansible_facts | default({})) | list }}
  loop: "{{ ansible_play_hosts | map('extract', hostvars, 'vm_hosts_pairs') | flatten(levels=1) }}"
  loop_control:
    label: "{{ item.1.name }}.{{ item.0 }}"
