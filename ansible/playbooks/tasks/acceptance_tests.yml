---
# End to end as acceptance_user, a throwaway dev user given with -e: the sample project gets a
# worktree, `hades up` and `hades down`, checked through the registry, Caddy, the dev Postgres
# and loopback isolation.
- name: Read the user's passwd entry
  ansible.builtin.getent:
    database: passwd
    key: "{{ acceptance_user }}"

# Before the block: its clean-up deletes ~/sample and ~/sample-wt in this user's home.
- name: Assert the user is a present dev user
  ansible.builtin.assert:
    that:
      - acceptance_user in user_present | map(attribute='name')
    fail_msg: "acceptance_user {{ acceptance_user }} is not a present dev user"
    quiet: true

- name: Bring a sample worktree up and down
  become: true
  vars:
    acceptance_repo: "{{ ansible_facts.getent_passwd[acceptance_user][4] }}/sample"
    acceptance_wt: "{{ acceptance_repo }}-wt"
    acceptance_entry: "{{ acceptance_ls.stdout | from_json | selectattr('Worktree', 'eq', acceptance_wt) | first | default({}) }}"
    acceptance_port: "{{ acceptance_entry.Port }}"
    acceptance_db: sample_dev{{ acceptance_entry.DBSuffix }}
    acceptance_psql: psql -h {{ dev_pg_host }} -p {{ dev_pg_port }} -U {{ dev_pg_user }} -d postgres -tAc 'SELECT datname FROM pg_database'
  block:
    - name: Copy the sample project
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../tests/sample-project/"
        dest: "{{ acceptance_repo }}/"
        owner: "{{ acceptance_user }}"
        group: "{{ acceptance_user }}"
        mode: "0644"
        directory_mode: "0755"

    - name: Commit it and add a worktree
      ansible.builtin.command:
        argv:
          - runuser
          - -l
          - "{{ acceptance_user }}"
          - -c
          - >-
            cd {{ acceptance_repo }} && git init -q -b main && git add -A
            && git -c user.name=hades -c user.email=hades@example.invalid commit -qm sample
            && git worktree add -q {{ acceptance_wt }} -b feature/acc
      changed_when: true

    - name: Run hades up in the worktree
      ansible.builtin.command: runuser -l {{ acceptance_user }} -c 'cd {{ acceptance_wt }} && hades up --ade shell'
      changed_when: true

    - name: List the worktrees
      ansible.builtin.command: runuser -l {{ acceptance_user }} -c 'hades ls --json'
      register: acceptance_ls
      changed_when: false

    - name: Assert the worktree is listed with a port and a host name
      ansible.builtin.assert:
        that:
          - acceptance_entry != {}
          - acceptance_entry.Project == 'sample'
          - acceptance_entry.Preset == 'phoenix'
          - acceptance_entry.ADE == 'shell'
          - acceptance_entry.Port > 0
          - acceptance_entry.Host == acceptance_entry.Label ~ '.' ~ hades_domain
        fail_msg: "hades ls --json has no proper entry for {{ acceptance_wt }}: {{ acceptance_ls.stdout }}"
        quiet: true

    - name: Read the site file and its live copy
      ansible.builtin.slurp:
        src: "{{ item }}/{{ acceptance_entry.Label }}.caddy"
      register: acceptance_sites
      loop:
        - "{{ hades_registry_root }}/sites"
        - "{{ hades_live_dir }}"

    - name: Assert both route the host name to the port
      ansible.builtin.assert:
        that:
          - item.content | b64decode == 'import worktree ' ~ acceptance_entry.Host ~ ' ' ~ acceptance_port ~ '\n'
        fail_msg: "{{ item.source }}: {{ item.content | b64decode }}"
        quiet: true
      loop: "{{ acceptance_sites.results }}"
      loop_control:
        label: "{{ item.source }}"

    - name: Serve the worktree on its port as the user
      ansible.builtin.command: >-
        systemd-run --unit=hades-acceptance-http.service --collect --uid={{ acceptance_user }}
        python3 -m http.server --bind {{ ingress_loopback_address }} --directory {{ acceptance_wt }} {{ acceptance_port }}
      changed_when: true

    - name: Wait for the server
      ansible.builtin.wait_for:
        host: "{{ ingress_loopback_address }}"
        port: "{{ acceptance_port | int }}"
        timeout: 10

    - name: Assert Caddy routes the host name to the worktree
      ansible.builtin.uri:
        url: http://{{ ingress_loopback_address }}:{{ caddy_port }}/
        headers:
          Host: "{{ acceptance_entry.Host }}"
        status_code: 200

    - name: List the dev databases
      ansible.builtin.command: "{{ acceptance_psql }}"
      environment:
        PGPASSWORD: "{{ dev_pg_password }}"
      register: acceptance_dbs_up
      changed_when: false

    - name: Connect to the worktree port as the probe account and as the user
      ansible.builtin.command: runuser -u {{ item }} -- nc -z -w 3 {{ ingress_loopback_address }} {{ acceptance_port }}
      register: acceptance_nc
      changed_when: false
      failed_when: false
      loop: ["{{ host_test_unprivileged_user }}", "{{ acceptance_user }}"]

    - name: Run hades doctor as the user
      ansible.builtin.command: runuser -l {{ acceptance_user }} -c 'hades doctor'
      register: acceptance_doctor
      changed_when: false
      failed_when: false

    - name: Assert the database exists, isolation holds and doctor passes
      ansible.builtin.assert:
        that:
          - acceptance_db in acceptance_dbs_up.stdout_lines
          - acceptance_nc.results[0].rc != 0
          - acceptance_nc.results[1].rc == 0
          - acceptance_doctor.rc == 0
        fail_msg: >-
          {{ acceptance_db }} listed: {{ acceptance_db in acceptance_dbs_up.stdout_lines }};
          port {{ acceptance_port }} probe rc {{ acceptance_nc.results[0].rc }} (expected refused),
          user rc {{ acceptance_nc.results[1].rc }} (expected 0);
          doctor rc {{ acceptance_doctor.rc }}: {{ acceptance_doctor.stdout_lines | select('match', '^(FAIL|WARN) ') | join(' | ') }}
        quiet: true

    - name: Run hades down in the worktree
      ansible.builtin.command: runuser -l {{ acceptance_user }} -c 'cd {{ acceptance_wt }} && hades down --strict'
      changed_when: true

    - name: Stat the site files and the port claim
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      register: acceptance_gone
      loop:
        - "{{ hades_registry_root }}/sites/{{ acceptance_entry.Label }}.caddy"
        - "{{ hades_live_dir }}/{{ acceptance_entry.Label }}.caddy"
        - "{{ hades_registry_root }}/ports/{{ acceptance_port }}"

    - name: List the dev databases again
      ansible.builtin.command: "{{ acceptance_psql }}"
      environment:
        PGPASSWORD: "{{ dev_pg_password }}"
      register: acceptance_dbs_down
      changed_when: false

    - name: Run hades gc as root
      ansible.builtin.command: hades gc
      changed_when: false

    - name: Assert hades down removed the sites, the port claim and the database
      ansible.builtin.assert:
        that:
          - acceptance_gone.results | selectattr('stat.exists') | list == []
          - acceptance_db not in acceptance_dbs_down.stdout_lines
        fail_msg: >-
          left behind: {{ acceptance_gone.results | selectattr('stat.exists') | map(attribute='item') | list }}
          {{ acceptance_db if acceptance_db in acceptance_dbs_down.stdout_lines else '' }}
        quiet: true

  always:
    - name: Stop the server
      ansible.builtin.systemd_service:
        name: hades-acceptance-http.service
        state: stopped
      failed_when: false

    - name: Release whatever the worktree still holds
      ansible.builtin.command: runuser -l {{ acceptance_user }} -c 'cd {{ acceptance_wt }} && hades down'
      changed_when: false
      failed_when: false

    - name: Remove the sample project and the worktree
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ acceptance_repo }}"
        - "{{ acceptance_wt }}"
