---
# End to end in acceptance_user's VM (a throwaway developer given with -e): the sample project gets
# `hades init`, a worktree, `hades up` and `hades down`, checked through the box's Caddy, the VM's
# Postgres and the developer's registry. After `hades down`, the worktree pins a Node version
# missing from the store, and `hades up` must fail with mise's not-installed error.
- name: Bring a sample worktree up and down
  vars:
    acceptance_repo: "{{ vm_home }}/sample"
    acceptance_wt: "{{ acceptance_repo }}-wt"
    acceptance_state: "{{ vm_home }}/.local/state/hades"
    acceptance_entry: "{{ acceptance_ls.stdout | from_json | selectattr('Worktree', 'eq', acceptance_wt) | first | default({}) }}"
    acceptance_db: sample_dev{{ acceptance_entry.DBSuffix }}
    acceptance_psql: psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -tAc 'SELECT datname FROM pg_database'
    acceptance_curl: >-
      curl -s -o /dev/null -w '%{http_code}' -H 'Host: {{ acceptance_entry.Host }}'
      http://{{ hades_loopback_address }}:{{ caddy_port }}/
  block:
    - name: Copy the sample project
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../tests/sample-project/"
        dest: "{{ acceptance_repo }}/"
        owner: "{{ dev.name }}"
        group: "{{ dev.name }}"
        mode: "0644"
        directory_mode: "0755"

    - name: Run hades init, commit and add a worktree
      ansible.builtin.command:
        argv:
          - runuser
          - -l
          - "{{ dev.name }}"
          - -c
          - >-
            cd {{ acceptance_repo }} && git init -q -b main && hades init && git add -A
            && git -c user.name=hades -c user.email=hades@example.invalid commit -qm sample
            && git worktree add -q {{ acceptance_wt }} -b feature/acc
      changed_when: true

    - name: Run hades up in the worktree
      ansible.builtin.command: runuser -l {{ dev.name }} -c 'cd {{ acceptance_wt }} && hades up --ade shell'
      changed_when: true

    - name: List the worktrees
      ansible.builtin.command: runuser -l {{ dev.name }} -c 'hades ls --json'
      register: acceptance_ls
      changed_when: false

    - name: Read the site file
      ansible.builtin.slurp:
        src: "{{ acceptance_state }}/sites/{{ acceptance_entry.Label | default('missing') }}.caddy"
      register: acceptance_site
      failed_when: false

    - name: Assert the worktree is listed under the developer's name and its site routes to its port
      ansible.builtin.assert:
        that:
          - acceptance_entry.Project | default('') == 'sample'
          - acceptance_entry.Preset == 'phoenix'
          - acceptance_entry.ADE == 'shell'
          - acceptance_entry.Port > 0
          - acceptance_entry.Label.startswith(dev.name ~ '-sample-')
          - acceptance_entry.Host == acceptance_entry.Label ~ '.' ~ hades_domain
          - acceptance_site.content | default('') | b64decode == 'import worktree ' ~ acceptance_entry.Host ~ ' ' ~ acceptance_entry.Port ~ '\n'
        fail_msg: "hades ls --json: {{ acceptance_ls.stdout }}; site file: {{ acceptance_site.content | default('') | b64decode or acceptance_site.msg }}"
        quiet: true

    - name: Serve the worktree on its port as the developer
      ansible.builtin.command: >-
        systemd-run --unit=hades-acceptance-http.service --collect --uid={{ dev.name }}
        python3 -m http.server --bind {{ hades_loopback_address }} --directory {{ acceptance_wt }} {{ acceptance_entry.Port }}
      changed_when: true

    - name: Wait for the server
      ansible.builtin.wait_for:
        host: "{{ hades_loopback_address }}"
        port: "{{ acceptance_entry.Port }}"
        timeout: 10

    - name: Request the worktree's name through the box's Caddy # noqa: command-instead-of-module
      ansible.builtin.command: "{{ acceptance_curl }}"
      delegate_to: "{{ hades_box }}"
      register: acceptance_web_up
      changed_when: false

    - name: List the dev databases
      ansible.builtin.command: "{{ acceptance_psql }}"
      register: acceptance_dbs_up
      changed_when: false

    - name: Run hades doctor as the developer
      ansible.builtin.command: runuser -l {{ dev.name }} -c 'hades doctor'
      register: acceptance_doctor
      changed_when: false
      failed_when: false

    - name: Run hades down in the worktree
      ansible.builtin.command: runuser -l {{ dev.name }} -c 'cd {{ acceptance_wt }} && hades down --strict'
      changed_when: true

    - name: Request the worktree's name through the box's Caddy again # noqa: command-instead-of-module
      ansible.builtin.command: "{{ acceptance_curl }}"
      delegate_to: "{{ hades_box }}"
      register: acceptance_web_down
      changed_when: false

    - name: Stat the site file and the port claim
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      register: acceptance_gone
      loop:
        - "{{ acceptance_state }}/sites/{{ acceptance_entry.Label }}.caddy"
        - "{{ acceptance_state }}/ports/{{ acceptance_entry.Port }}"

    - name: List the dev databases again
      ansible.builtin.command: "{{ acceptance_psql }}"
      register: acceptance_dbs_down
      changed_when: false

    - name: Assert up served the worktree, doctor passed and down removed its name, site, port and database
      ansible.builtin.assert:
        that:
          - acceptance_web_up.stdout == '200'
          - acceptance_db in acceptance_dbs_up.stdout_lines
          - acceptance_doctor.rc == 0
          - acceptance_web_down.stdout == '302'
          - acceptance_gone.results | selectattr('stat.exists') | list == []
          - acceptance_db not in acceptance_dbs_down.stdout_lines
        fail_msg: >-
          through the box: {{ acceptance_web_up.stdout }} up (want 200), {{ acceptance_web_down.stdout }} down (want 302);
          {{ acceptance_db }} listed up/down: {{ acceptance_db in acceptance_dbs_up.stdout_lines }}/{{ acceptance_db in acceptance_dbs_down.stdout_lines }};
          left behind: {{ acceptance_gone.results | selectattr('stat.exists') | map(attribute='item') | list }};
          doctor rc {{ acceptance_doctor.rc }}: {{ acceptance_doctor.stdout_lines | select('match', '^(FAIL|WARN) ') | join(' | ') }}
        quiet: true

    # The sample's setup never runs node, so this hades.toml does.
    - name: Pin node 1.0.0 and run node in setup
      ansible.builtin.copy:
        dest: "{{ acceptance_wt }}/{{ item.name }}"
        content: "{{ item.content }}"
        owner: "{{ dev.name }}"
        group: "{{ dev.name }}"
        mode: "0644"
      loop:
        - {name: .tool-versions, content: "node 1.0.0\n"}
        - {name: hades.toml, content: "setup = ['node --version']\n"}
      loop_control:
        label: "{{ item.name }}"

    - name: Run hades up in the worktree pinning node 1.0.0
      ansible.builtin.command: runuser -l {{ dev.name }} -c 'cd {{ acceptance_wt }} && hades up --ade shell'
      register: acceptance_bad_up
      changed_when: true
      failed_when: false

    - name: List the developer's Node versions there
      ansible.builtin.command: runuser -l {{ dev.name }} -c 'cd {{ acceptance_wt }} && mise ls --json node'
      register: acceptance_bad_node
      changed_when: false

    - name: Assert hades up failed with mise's not-installed error and installed nothing
      vars:
        acceptance_bad_out: "{{ acceptance_bad_up.stdout ~ acceptance_bad_up.stderr }}"
      ansible.builtin.assert:
        that:
          - acceptance_bad_up.rc != 0
          - "'Tool not installed for shim: node' in acceptance_bad_out"
          - "'node@1.0.0' in acceptance_bad_out"
          - acceptance_bad_node.stdout | from_json | selectattr('version', 'eq', '1.0.0') | selectattr('installed') | list == []
        fail_msg: "rc {{ acceptance_bad_up.rc }}: {{ acceptance_bad_out }}; mise ls: {{ acceptance_bad_node.stdout }}"
        quiet: true

  always:
    - name: Stop the server
      ansible.builtin.systemd_service:
        name: hades-acceptance-http.service
        state: stopped
      failed_when: false

    - name: Release whatever the worktree still holds
      ansible.builtin.command: runuser -l {{ dev.name }} -c 'cd {{ acceptance_wt }} && hades down'
      changed_when: false
      failed_when: false

    - name: Remove the sample project and the worktree
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ acceptance_repo }}"
        - "{{ acceptance_wt }}"
