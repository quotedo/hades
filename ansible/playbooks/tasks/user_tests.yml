---
# Per present dev user. The login checks go through `runuser -l`, so they see what a login sees:
# ~/.profile, ~/.bashrc and /etc/profile.d. Not `sudo -i`: sudo-rs hands its command to the
# login shell without quoting it.
- name: Read the passwd entries
  ansible.builtin.getent:
    database: passwd

- name: Read the groups
  ansible.builtin.getent:
    database: group

- name: Read each dev user's linger setting
  ansible.builtin.command: loginctl show-user {{ item.name }} -p Linger --value
  register: user_test_linger
  changed_when: false
  failed_when: false
  loop: "{{ user_present }}"
  loop_control:
    label: "{{ item.name }}"

- name: Read each dev user's slice
  ansible.builtin.systemd_service:
    name: user-{{ item.uid }}.slice
  register: user_test_slice
  loop: "{{ user_present }}"
  loop_control:
    label: "{{ item.name }}"

- name: Read each dev user's user manager unit
  ansible.builtin.systemd_service:
    name: user@{{ item.uid }}.service
  register: user_test_manager
  loop: "{{ user_present }}"
  loop_control:
    label: "{{ item.name }}"

# A manager property, which the systemd_service module does not read.
- name: Read each user manager's DefaultLimitNOFILE
  ansible.builtin.command: systemctl --user -M {{ item.name }}@ show -p DefaultLimitNOFILE --value # noqa: command-instead-of-module
  become: true
  register: user_test_user_conf
  changed_when: false
  failed_when: false
  loop: "{{ user_present }}"
  loop_control:
    label: "{{ item.name }}"

- name: Run the toolchain in each dev user's login shell
  ansible.builtin.command:
    argv:
      - runuser
      - -l
      - "{{ item.name }}"
      - -c
      - >-
        node --version && claude --version && codex --version && command -v node
        && direnv version && hades version && gh --version
        && printf 'ERL_FLAGS=%s\nCHROME_PATH=%s\nMIX_HOME=%s\nPATH=%s\n' "$ERL_FLAGS" "$CHROME_PATH" "$MIX_HOME" "$PATH"
    # Otherwise the module expands $PATH with root's value before the login shell runs.
    expand_argument_vars: false
  become: true
  register: user_test_login
  changed_when: false
  failed_when: false
  loop: "{{ user_present }}"
  loop_control:
    label: "{{ item.name }}"

- name: Try sudo as each dev user
  ansible.builtin.command: runuser -u {{ item.name }} -- sudo -n true
  become: true
  register: user_test_sudo
  changed_when: false
  failed_when: false
  loop: "{{ user_present }}"
  loop_control:
    label: "{{ item.name }}"

# Vacuous where nothing listens on a blocked port.
- name: Connect to each blocked port as each dev user, which must be refused
  ansible.builtin.command: runuser -u {{ item.0.name }} -- nc -z -w 3 {{ host_loopback_address }} {{ item.1 }}
  become: true
  register: user_test_blocked
  changed_when: false
  failed_when: user_test_blocked.rc == 0
  loop: "{{ user_present | product((protected | default({})).blocked_ports | default([])) | list }}"
  loop_control:
    label: "{{ item.0.name }} to {{ item.1 }}"

- name: Run hades doctor as each dev user
  ansible.builtin.command: runuser -l {{ item.name }} -c 'hades doctor'
  become: true
  register: user_test_doctor
  changed_when: false
  failed_when: false
  loop: "{{ user_present }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert each dev user's account, resource policy and login environment
  ansible.builtin.assert:
    that:
      - user_test_pw[1] == item.uid | string
      - user_test_pw[5] == '/bin/bash'
      - hades_group in user_test_groups
      - "'docker' not in user_test_groups"
      - (item.name in ansible_facts.getent_group['sudo'][2].split(',')) == (item.admin | default(false))
      - user_test_linger.results[i].stdout == 'yes'
      - user_test_slice.results[i].status.MemoryHigh == dev_user_memory_high | human_to_bytes | string
      - user_test_slice.results[i].status.MemoryMax == dev_user_memory_max | human_to_bytes | string
      - user_test_slice.results[i].status.MemorySwapMax == dev_user_memory_swap_max | human_to_bytes | string
      - user_test_slice.results[i].status.CPUWeight == dev_user_cpu_weight | string
      - user_test_slice.results[i].status.TasksMax == dev_user_tasks_max | string
      - user_test_manager.results[i].status.LimitNOFILE == default_limit_nofile | string
      - user_test_user_conf.results[i].stdout == default_limit_nofile | string
      - user_test_login.results[i].rc == 0
      - (mise_shims ~ '/node') in user_test_login.results[i].stdout_lines
      - user_test_login.results[i].stdout is not search('^PATH=.*/[.]asdf/', multiline=True)
      - ('ERL_FLAGS=' ~ erl_flags) in user_test_login.results[i].stdout_lines
      - ('CHROME_PATH=' ~ chrome_root ~ '/chrome') in user_test_login.results[i].stdout_lines
      - ('MIX_HOME=' ~ user_test_pw[4] ~ '/.mix') in user_test_login.results[i].stdout_lines
      - user_test_sudo.results[i].rc == 1
      - user_test_sudo.results[i].stderr is search('^sudo:', multiline=True)
      - user_test_doctor.results[i].stdout is search('^ok +host-config:', multiline=True)
      - user_test_doctor.results[i].rc == 0
    fail_msg: |-
      {{ item.name }}: passwd {{ user_test_pw | join(':') }}; groups {{ user_test_groups | join(',') }}
      linger {{ user_test_linger.results[i].stdout }}; user@ LimitNOFILE {{ user_test_manager.results[i].status.LimitNOFILE }},
      DefaultLimitNOFILE {{ user_test_user_conf.results[i].stdout }}
      slice {{ user_test_slice.results[i].status | dict2items
               | selectattr('key', 'in', ['MemoryHigh', 'MemoryMax', 'MemorySwapMax', 'CPUWeight', 'TasksMax']) | items2dict }}
      login rc {{ user_test_login.results[i].rc }}: {{ (user_test_login.results[i].stdout_lines + user_test_login.results[i].stderr_lines) | join(' | ') }}
      sudo -n true rc {{ user_test_sudo.results[i].rc }}: {{ user_test_sudo.results[i].stderr }}
      doctor rc {{ user_test_doctor.results[i].rc }}: {{ user_test_doctor.results[i].stdout_lines | select('match', '^(FAIL|WARN) ') | join(' | ')
                                                     or user_test_doctor.results[i].stderr }}
    quiet: true
  loop: "{{ user_present }}"
  loop_control:
    index_var: i
    label: "{{ item.name }}"
  vars:
    user_test_pw: "{{ ansible_facts.getent_passwd[item.name] | default(['missing'] * 6) }}"
    user_test_groups: >-
      {{ ansible_facts.getent_group | dict2items | selectattr('value.2', 'search', '(^|,)' ~ item.name ~ '(,|$)') | map(attribute='key') | list }}

- name: Read sshd's effective settings
  ansible.builtin.command: sshd -T
  become: true
  register: user_test_sshd
  changed_when: false

- name: Assert sshd allows agent forwarding and refuses password logins with an administrator
  ansible.builtin.assert:
    that:
      - "'allowagentforwarding yes' in user_test_sshd.stdout_lines"
      - "('passwordauthentication no' in user_test_sshd.stdout_lines and 'kbdinteractiveauthentication no' in user_test_sshd.stdout_lines)
        or user_present | selectattr('admin', 'defined') | selectattr('admin') | list | length == 0"
    fail_msg: >-
      sshd -T: {{ user_test_sshd.stdout_lines | select('match', '^(allowagentforwarding|passwordauthentication|kbdinteractiveauthentication) ') | join(', ') }}
    quiet: true

# Keys, first-login welcome and administrator password. Each loop runs over every present user,
# skipping where it does not apply, so the results line up with user_present.
- name: Fetch each GitHub user's public keys from the controller
  ansible.builtin.uri:
    url: https://github.com/{{ item.github }}.keys
    return_content: true
  delegate_to: localhost
  become: false
  register: user_test_github
  when: item.github is defined
  loop: "{{ user_present }}"
  loop_control:
    label: "{{ item.name }}"

- name: Read each dev user's authorized keys
  ansible.builtin.slurp:
    src: "{{ user_home_base }}/{{ item.name }}/.ssh/authorized_keys"
  become: true
  register: user_test_authorized
  failed_when: false
  loop: "{{ user_present }}"
  loop_control:
    label: "{{ item.name }}"

- name: Read the GitHub login list
  ansible.builtin.slurp:
    src: "{{ hades_config_dir }}/github-logins"
  become: true
  register: user_test_logins
  failed_when: false

- name: Stat each dev user's welcome
  ansible.builtin.stat:
    path: "{{ user_home_base }}/{{ item.name }}/.config/hades/welcome"
  become: true
  register: user_test_welcome
  loop: "{{ user_present }}"
  loop_control:
    label: "{{ item.name }}"

- name: Stat each dev user's onboarded marker
  ansible.builtin.stat:
    path: "{{ user_home_base }}/{{ item.name }}/.config/hades/onboarded"
  become: true
  register: user_test_onboarded
  loop: "{{ user_present }}"
  loop_control:
    label: "{{ item.name }}"

# What `ssh box true` runs: bash reads ~/.bashrc for a command over SSH.
- name: Run a command through each dev user's ~/.bashrc, non-interactive
  ansible.builtin.command:
    argv: [runuser, -u, "{{ item.name }}", --, bash, -c, '. "$HOME/.bashrc"; true']
    expand_argument_vars: false
  become: true
  register: user_test_shell
  changed_when: false
  failed_when: false
  loop: "{{ user_present }}"
  loop_control:
    label: "{{ item.name }}"

- name: Start an interactive login shell as each dev user
  ansible.builtin.command: runuser -u {{ item.name }} -- bash -lic true
  become: true
  register: user_test_interactive
  changed_when: false
  failed_when: false
  loop: "{{ user_present }}"
  loop_control:
    label: "{{ item.name }}"

- name: Stat each administrator's password file
  ansible.builtin.stat:
    path: "{{ hades_config_dir }}/admin-password.{{ item.name }}"
  become: true
  register: user_test_admin_file
  when: item.admin | default(false)
  loop: "{{ user_present }}"
  loop_control:
    label: "{{ item.name }}"

- name: Read each administrator's password status
  ansible.builtin.command: passwd -S {{ item.name }}
  become: true
  register: user_test_admin_status
  changed_when: false
  when: item.admin | default(false)
  loop: "{{ user_present }}"
  loop_control:
    label: "{{ item.name }}"

# Only while the generated file exists: after `passwd` the administrator deletes it.
# The redirect runs as root, so the password passes through no variable and no command line.
- name: Sudo as each administrator with the stored password
  ansible.builtin.shell: >-
    runuser -u {{ item.name }} -- sudo -S -k true
    < {{ (hades_config_dir ~ '/admin-password.' ~ item.name) | quote }}
  become: true
  register: user_test_admin_sudo
  changed_when: false
  failed_when: false
  no_log: true
  when: item.admin | default(false) and user_test_admin_file.results[i].stat.exists | default(false)
  loop: "{{ user_present }}"
  loop_control:
    index_var: i
    label: "{{ item.name }}"

- name: Assert each dev user's keys, login list, welcome and administrator password
  ansible.builtin.assert:
    that:
      - item.github is not defined or user_test_github_keys | length > 0
      - item.github is not defined or user_test_github_keys | reject('in', user_test_keys) | list == []
      - item.ssh_keys | default([]) | reject('in', user_test_keys) | list == []
      - user_test_login_lines | select('match', item.name ~ ':') | list == [item.name ~ ':' ~ item.github | default('')]
      - user_test_welcome.results[i].stat.exists != user_test_onboarded.results[i].stat.exists
      - not user_test_welcome.results[i].stat.exists
        or (user_test_welcome.results[i].stat.mode == '0600' and user_test_welcome.results[i].stat.pw_name == item.name)
      - user_test_shell.results[i].rc == 0
      - user_test_shell.results[i].stdout == ''
      - (user_test_interactive.results[i].stdout is search('^Welcome to ', multiline=True)) == user_test_welcome.results[i].stat.exists
      - not item.admin | default(false) or user_test_admin_status.results[i].stdout.split()[1] == 'P'
      - not user_test_admin_file.results[i].stat.exists | default(false)
        or (user_test_admin_file.results[i].stat.pw_name == 'root' and user_test_admin_file.results[i].stat.mode == '0600')
      - not user_test_admin_file.results[i].stat.exists | default(false) or user_test_admin_sudo.results[i].rc == 0
    fail_msg: |-
      {{ item.name }}: {{ user_test_github_keys | reject('in', user_test_keys) | list | length }} of
      {{ user_test_github_keys | length }} GitHub keys and {{ item.ssh_keys | default([]) | reject('in', user_test_keys) | list | length }}
      static keys missing from authorized_keys;
      login list: {{ user_test_login_lines | select('match', item.name ~ ':') | join(', ') or 'no line' }};
      welcome {{ user_test_welcome.results[i].stat.mode | default('absent') }}, onboarded
      {{ 'present' if user_test_onboarded.results[i].stat.exists else 'absent' }};
      non-interactive output: {{ user_test_shell.results[i].stdout_lines | join(' | ') or 'none' }};
      interactive output: {{ user_test_interactive.results[i].stdout_lines | first | default('none') }};
      admin password status {{ (user_test_admin_status.results[i].stdout | default('')).split()[1:2] | join or 'n/a' }},
      file {{ user_test_admin_file.results[i].stat.mode | default('absent') }}
      {{ user_test_admin_file.results[i].stat.pw_name | default('') }}, sudo -S rc {{ user_test_admin_sudo.results[i].rc | default('n/a') }}
    quiet: true
  loop: "{{ user_present }}"
  loop_control:
    index_var: i
    label: "{{ item.name }}"
  vars:
    user_test_github_keys: "{{ (user_test_github.results[i].content | default('')).splitlines() | select | list }}"
    user_test_keys: "{{ (user_test_authorized.results[i].content | default('') | b64decode).splitlines() }}"
    user_test_login_lines: "{{ (user_test_logins.content | default('') | b64decode).splitlines() }}"
