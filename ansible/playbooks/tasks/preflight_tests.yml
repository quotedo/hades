---
- name: Preflight rejects an inventory without hades_domain
  ansible.builtin.command:
    cmd: >-
      ansible-playbook -i {{ playbook_dir }}/../tests/inventories/missing-domain.yml
      {{ playbook_dir }}/preflight.yml
  delegate_to: localhost
  run_once: true
  register: preflight_missing_domain
  changed_when: false
  failed_when: preflight_missing_domain.rc == 0

- name: Preflight names the colliding logins
  ansible.builtin.command:
    cmd: >-
      ansible-playbook -i {{ playbook_dir }}/../tests/inventories/colliding-logins.yml
      {{ playbook_dir }}/preflight.yml
  delegate_to: localhost
  run_once: true
  register: preflight_colliding
  changed_when: false
  failed_when: preflight_colliding.rc == 0

- name: Preflight rejects present dev users sharing a uid
  ansible.builtin.command:
    cmd: >-
      ansible-playbook -i {{ playbook_dir }}/../tests/inventories/duplicate-uids.yml
      {{ playbook_dir }}/preflight.yml
  delegate_to: localhost
  run_once: true
  register: preflight_duplicate_uids
  changed_when: false
  failed_when: preflight_duplicate_uids.rc == 0

- name: Preflight rejects orca without Tailscale
  ansible.builtin.command:
    cmd: >-
      ansible-playbook -i {{ playbook_dir }}/../tests/inventories/orca-without-tailscale.yml
      {{ playbook_dir }}/preflight.yml
  delegate_to: localhost
  run_once: true
  register: preflight_orca_without_tailscale
  changed_when: false
  failed_when: preflight_orca_without_tailscale.rc == 0

- name: Preflight accepts a valid inventory
  ansible.builtin.command:
    cmd: >-
      ansible-playbook -i {{ playbook_dir }}/../tests/inventories/valid.yml
      {{ playbook_dir }}/preflight.yml
  delegate_to: localhost
  run_once: true
  register: preflight_valid
  changed_when: false
  failed_when: preflight_valid.rc != 0

- name: Assert the failure messages are the expected ones
  ansible.builtin.assert:
    that:
      - "'hades_domain must be defined' in preflight_missing_domain.stdout"
      - "'Logins collide' in preflight_colliding.stdout"
      - "'[j-smith, jsmith]' in preflight_colliding.stdout"
      - "'Present dev_users share a uid: 3001 [alice, bob]' in preflight_duplicate_uids.stdout"
      - "'orca is listed by: alice — it pairs over Tailscale' in preflight_orca_without_tailscale.stdout"
    quiet: true
  run_once: true
