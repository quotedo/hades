---
- name: Read the gc and backup timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
  loop: [hades-gc.timer, hades-backup.timer]
  register: host_test_timers

- name: Assert the gc and backup timers are enabled and active
  ansible.builtin.assert:
    that:
      - item.status.UnitFileState == 'enabled'
      - item.status.ActiveState == 'active'
    fail_msg: >-
      {{ item.item }} is {{ item.status.UnitFileState | default('missing') }} and
      {{ item.status.ActiveState | default('missing') }}
    quiet: true
  loop: "{{ host_test_timers.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Run hades gc as root without releasing anything
  ansible.builtin.command: "{{ hades_bin_dir }}/hades gc --dry-run"
  become: true
  changed_when: false

- name: Run the backup
  ansible.builtin.command: "{{ hades_bin_dir }}/hades-backup"
  become: true
  register: host_test_backup
  changed_when: false
  failed_when: false

- name: Assert the backup succeeds
  ansible.builtin.assert:
    that:
      - host_test_backup.rc == 0
    fail_msg: "hades-backup exited {{ host_test_backup.rc }}: {{ host_test_backup.stderr | default('') }}"
    quiet: true

- name: Stat the backup directory
  ansible.builtin.stat:
    path: "{{ backup_dir }}"
  become: true
  register: host_test_backup_dir

- name: Assert the backup directory is root 0700
  ansible.builtin.assert:
    that:
      - host_test_backup_dir.stat.isdir | default(false)
      - host_test_backup_dir.stat.mode == '0700'
      - host_test_backup_dir.stat.pw_name == 'root'
    fail_msg: "{{ backup_dir }} must be a root-owned directory with mode 0700"
    quiet: true

- name: Run hades-status
  ansible.builtin.command: "{{ hades_bin_dir }}/hades-status"
  become: true
  register: host_test_status
  changed_when: false
  failed_when: false

- name: Assert hades-status exits 0 and lists worktrees
  ansible.builtin.assert:
    that:
      - host_test_status.rc == 0
      - host_test_status.stdout is search('^worktrees:', multiline=true)
    fail_msg: "hades-status exited {{ host_test_status.rc }}: {{ host_test_status.stderr | default('') }}"
    quiet: true

- name: Source the profile script as an account outside group hades
  ansible.builtin.shell: . /etc/profile.d/hades.sh && echo "${CHROME_PATH-unset} ${ERL_FLAGS-unset}"
  become: true
  register: host_test_profile_root
  changed_when: false
  failed_when: false

- name: Read the profile script
  ansible.builtin.slurp:
    src: /etc/profile.d/hades.sh
  register: host_test_profile
  failed_when: false

- name: Assert the profile script exports CHROME_PATH and ERL_FLAGS only for group hades
  ansible.builtin.assert:
    that:
      - host_test_profile_root.rc == 0
      - host_test_profile_root.stdout == 'unset unset'
      - ('export CHROME_PATH=' ~ (chrome_root ~ '/chrome') | quote) in host_test_profile_text
      - ('export ERL_FLAGS=' ~ erl_flags | quote) in host_test_profile_text
    fail_msg: >-
      /etc/profile.d/hades.sh must export CHROME_PATH and ERL_FLAGS for group {{ hades_group }}
      only; sourced as root it printed: {{ host_test_profile_root.stdout | default('') }}
    quiet: true
  vars:
    host_test_profile_text: "{{ host_test_profile.content | default('') | b64decode }}"

- name: Stat Chrome for Testing
  ansible.builtin.stat:
    path: "{{ chrome_root }}/chrome"
  register: host_test_chrome

- name: Run Chrome for Testing
  ansible.builtin.command: "{{ chrome_root }}/chrome --version"
  register: host_test_chrome_version
  changed_when: false
  failed_when: false
  when: host_test_chrome.stat.exists

- name: Assert Chrome for Testing is executable and runs
  ansible.builtin.assert:
    that:
      - host_test_chrome.stat.exists
      - host_test_chrome.stat.executable
      - host_test_chrome_version.rc == 0
    fail_msg: >-
      {{ chrome_root }}/chrome must be executable and run: {{ host_test_chrome_version.stdout | default('') }}
      {{ host_test_chrome_version.stderr | default('') }}
    quiet: true

# Agents drive Chrome as their own non-root user, with the sandbox on (acceptance 3). Where
# unprivileged user namespaces are restricted (Ubuntu 24.04+), that needs the AppArmor profile.
- name: Run Chrome headless with its sandbox as an unprivileged account
  become: true
  block:
    - name: Create a scratch directory for the unprivileged Chrome run
      ansible.builtin.tempfile:
        state: directory
        prefix: hades-chrome-test.
      register: host_test_chrome_tmp

    - name: Hand the scratch directory to the unprivileged account
      ansible.builtin.file:
        path: "{{ host_test_chrome_tmp.path }}"
        owner: "{{ verify_unprivileged_user }}"
        mode: "0700"

    - name: Dump about:blank with Chrome as the unprivileged account, sandbox enabled
      ansible.builtin.command:
        argv:
          - timeout
          - -k
          - "5"
          - "60"
          - runuser
          - -u
          - "{{ verify_unprivileged_user }}"
          - --
          - env
          - HOME={{ host_test_chrome_tmp.path }}
          - "{{ chrome_root }}/chrome"
          - --headless
          - --no-first-run
          - --disable-gpu
          - --user-data-dir={{ host_test_chrome_tmp.path }}/profile
          - --dump-dom
          - about:blank
      register: host_test_chrome_unpriv
      changed_when: false
      failed_when: false

    - name: Assert Chrome renders a page as the unprivileged account with its sandbox
      ansible.builtin.assert:
        that:
          - host_test_chrome_unpriv.rc == 0
          - "'<html' in host_test_chrome_unpriv.stdout"
        fail_msg: >-
          Chrome as {{ verify_unprivileged_user }} exited {{ host_test_chrome_unpriv.rc }}:
          {{ host_test_chrome_unpriv.stderr_lines | default([]) | select('search', 'sandbox|namespace|FATAL') | list | join(' | ') }}
        quiet: true

  always:
    # timeout signals runuser only; Chrome's zygote and renderers may outlive it.
    - name: Stop Chrome processes left by the test
      ansible.builtin.command: pkill -u {{ verify_unprivileged_user }} -f {{ host_test_chrome_tmp.path }}
      changed_when: false
      failed_when: false
      when: host_test_chrome_tmp.path is defined

    - name: Remove the scratch directory
      ansible.builtin.file:
        path: "{{ host_test_chrome_tmp.path }}"
        state: absent
      when: host_test_chrome_tmp.path is defined
