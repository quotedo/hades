---
# Verification playbook. Each check set is selected by a tag.
- name: Import preflight
  ansible.builtin.import_playbook: preflight.yml
  tags: [preflight]

- name: Verify the collection
  hosts: dev_servers
  gather_facts: false
  roles:
    # Loads the shared defaults (roles/host/defaults/main.yml) at role-default precedence, so
    # inventory values still win; the `never` tag keeps the role's tasks from running here.
    # Do not use vars_files instead: play vars_files outrank inventory host vars.
    - { role: host, tags: [never] }
    - { role: postgres, tags: [never] }
  tasks:
    - name: Preflight tests
      ansible.builtin.import_tasks: tasks/preflight_tests.yml
      tags: [preflight]

    - name: Host tests
      ansible.builtin.import_tasks: tasks/host_tests.yml
      tags: [host]

    - name: Loopback isolation tests
      ansible.builtin.import_tasks: tasks/isolation_tests.yml
      tags: [isolation]

    - name: Ops tests
      ansible.builtin.import_tasks: tasks/ops_tests.yml
      tags: [ops]

    - name: Postgres tests
      ansible.builtin.import_tasks: tasks/postgres_tests.yml
      tags: [postgres]
