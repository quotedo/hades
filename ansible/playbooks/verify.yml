---
# Verification playbook. Each check set is selected by a tag.
- name: Verify the collection
  hosts: dev_servers
  # The VM sizes default to the host's threads, and percentages count against its memory.
  gather_subset: [hardware]
  vars:
    # The account the hades-onboard probe runs as.
    verify_unprivileged_user: nobody
  roles:
    # Listed only to load each role's defaults for the tests, at role-default precedence, so
    # inventory values still win. Do not use vars_files instead: play vars_files outrank inventory
    # host vars. `never` keeps the roles' tasks out of the output; `when: false` keeps a task that
    # carries its own tag (cloudflared, ...) from running under `--tags <that tag>`, which selects
    # it past `never`.
    - { role: host, tags: [never], when: false }
    - { role: ingress, tags: [never], when: false }
  # Before the tests, so that the VM hosts get the box's inventory variables and no results.
  pre_tasks:
    - name: Add the VMs to dev_vms
      ansible.builtin.import_tasks: tasks/vm_hosts.yml
      tags: [always]
  tasks:
    - name: Host tests
      ansible.builtin.import_tasks: tasks/host_tests.yml
      tags: [host]

    - name: VM tests
      ansible.builtin.import_tasks: tasks/vms_tests.yml
      tags: [vms]

    - name: Isolation tests
      ansible.builtin.import_tasks: tasks/isolation_tests.yml
      tags: [isolation]

    - name: Ingress tests
      ansible.builtin.import_tasks: tasks/ingress_tests.yml
      tags: [ingress]

    - name: VPN tests
      ansible.builtin.import_tasks: tasks/vpn_tests.yml
      tags: [vpn]
      when: vpn_enabled

- name: Verify the VMs
  hosts: dev_vms
  gather_facts: false
  roles:
    - { role: host, tags: [never], when: false }
  tasks:
    - name: Reach the VM through its box
      ansible.builtin.ping:
      tags: [vms]
