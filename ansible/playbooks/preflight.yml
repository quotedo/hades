---
# Input validation. Runs before anything touches a host, under any tag selection (`always`).
# The host role is listed for its defaults only (dev_present, vm_*), as in verify.yml.
- name: Preflight
  hosts: dev_servers
  gather_subset: [hardware]
  roles:
    - { role: host, tags: [never], when: false }
  tasks:
    - name: Validate the inventory
      tags: [always]
      block:
        - name: Assert hades_domain is a non-empty string
          ansible.builtin.assert:
            that:
              - hades_domain is defined
              - hades_domain is string
              - hades_domain | length > 0
            fail_msg: hades_domain must be defined as a non-empty string
            quiet: true

        - name: Assert dev_users is a list
          ansible.builtin.assert:
            that:
              - dev_users is defined
              - dev_users is sequence
              - dev_users is not string
              - dev_users is not mapping
            fail_msg: dev_users must be defined as a list
            quiet: true

        # The name starts the developer's web labels (<name>-<project>-<worktree>), so no dash; the
        # uid gives the VM's address.
        - name: Assert every dev_users entry is well formed
          ansible.builtin.assert:
            that:
              - item.name is defined
              - item.name is string
              - item.name is match('^[a-z][a-z0-9]*$')
              - item.uid is defined
              - item.uid is integer
              - item.uid >= 1000
              - item.uid < 65536
              - (item.state | default('present')) in ['present', 'absent']
              - (item.ades | default([])) is sequence
              - (item.ades | default([])) is not string
              - (item.ades | default([])) is subset(['paseo', 'orca'])
              - (item.ssh_keys | default([])) is sequence
              - (item.ssh_keys | default([])) is not string
            fail_msg: >-
              dev_users entry {{ item.name | default('<unnamed>') }} is invalid: name must match
              ^[a-z][a-z0-9]*$, uid must be an integer from 1000 to 65535, state must be present or
              absent, ades must be a list drawn from paseo and orca, ssh_keys a list
            quiet: true
          loop: "{{ dev_users }}"
          loop_control:
            label: "{{ item.name | default('<unnamed>') }}"

        # authorized_keys is built from the GitHub login's keys and the static ssh_keys.
        - name: Assert every present dev user has a GitHub login or static SSH keys
          ansible.builtin.assert:
            that:
              - (item.github is defined and item.github is string and item.github is match('^[A-Za-z0-9-]+$'))
                or item.ssh_keys | default([]) | length > 0
            fail_msg: "dev_users entry {{ item.name }} needs github (a GitHub login) or a non-empty ssh_keys"
            quiet: true
          loop: "{{ dev_present }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Assert names of present dev users are unique
          ansible.builtin.assert:
            that:
              - hades_names | unique | length == hades_names | length
            fail_msg: >-
              Present dev_users share a name:
              {% for name in hades_names | unique if hades_names.count(name) > 1 %}{{ name }} {% endfor %}
            quiet: true
          vars:
            hades_names: "{{ dev_present | map(attribute='name') | list }}"

        - name: Assert uids of present dev users are unique
          ansible.builtin.assert:
            that:
              - dev_present | map(attribute='uid') | unique | length == dev_present | length
            fail_msg: >-
              Present dev_users share a uid:
              {% for uid, users in dev_present | groupby('uid')
                 if users | length > 1 %}{{ uid }} [{{ users | map(attribute='name') | join(', ') }}] {% endfor %}
            quiet: true

        # dev_services selects the compose services; postgres_settings fills the dev cluster's conf.d file.
        - name: Assert dev_services is a list of known services and postgres_settings a mapping
          ansible.builtin.assert:
            that:
              - dev_services | default([]) is sequence
              - dev_services | default([]) is not string
              - dev_services | default([]) | difference(['rabbitmq', 'localstack', 'redis']) == []
              - postgres_settings | default({}) is mapping
            fail_msg: dev_services must be a list drawn from rabbitmq, localstack and redis, postgres_settings a mapping
            quiet: true

        # The user role adds each repository with the key and fingerprint these controller variables hold.
        - name: Assert every hex_repos entry is complete and its variables are set
          ansible.builtin.assert:
            that:
              - item.name is defined
              - item.url is defined
              - item.key_env is defined and lookup('ansible.builtin.env', item.key_env) | length > 0
              - item.fingerprint_env is defined and lookup('ansible.builtin.env', item.fingerprint_env) | length > 0
            fail_msg: "hex_repos entry {{ item.name | default('<unnamed>') }} needs name, url, key_env and fingerprint_env, both set in the environment"
            quiet: true
          loop: "{{ hex_repos | default([]) }}"
          loop_control:
            label: "{{ item.name | default('<unnamed>') }}"

        # The Cloudflare tasks (ingress role) build the Access allow-list from these.
        - name: Assert every present dev user has an email when Cloudflare is managed
          ansible.builtin.assert:
            that:
              - item.email is defined
              - item.email is string
              - item.email is match('^[^@\\s]+@[^@\\s]+$')
            fail_msg: "dev_users entry {{ item.name }} needs an email (the Cloudflare Access allow-list) while CF_API_TOKEN is set"
            quiet: true
          loop: "{{ dev_present }}"
          loop_control:
            label: "{{ item.name }}"
          when: lookup('ansible.builtin.env', 'CF_API_TOKEN') | length > 0

        # Exact versions keep two boxes or two applies on the same release; keys are mise registry
        # names, under which `mise ls --json` reports them (go, never golang).
        - name: Assert every tools version is exact
          ansible.builtin.assert:
            that:
              - item.key != 'golang'
              - item.value is sequence
              - item.value is not string
              - item.value | length > 0
              - item.value | reject('string') | list == []
              - item.value | reject('match', '^\\d+\\.\\d+(\\.\\d+)*([.-][A-Za-z0-9.-]+)?$') | list == []
            fail_msg: >-
              {{ 'tools.golang: use go, the mise registry name' if item.key == 'golang' else
                 'tools.' ~ item.key ~ ': versions must be exact quoted strings, major.minor at least, got '
                 ~ item.value | to_json }}
            quiet: true
          loop: "{{ tools | default({}) | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: Assert tools include node and gh
          ansible.builtin.assert:
            that:
              - tools is not defined or ('node' in tools and 'gh' in tools)
            fail_msg: tools must include node (the agent CLIs run on it) and gh (hades-onboard needs it)
            quiet: true

        # A VM's address is the subnet's first two octets, uid // 256 and uid % 256.
        - name: Assert vm_subnet is a /16 ending in .0.0
          ansible.builtin.assert:
            that:
              - vm_subnet is match('^([0-9]{1,3}\\.){2}0\\.0/16$')
            fail_msg: "vm_subnet must be <a>.<b>.0.0/16, got {{ vm_subnet }}"
            quiet: true

        # The vpn role reads the config from the environment variable vpn_conf_env names. It installs
        # no resolvconf, so a DNS line would fail the tunnel, and a full tunnel would take the default
        # route; a route into vm_subnet would take the VMs' own traffic.
        - name: Check the VPN config
          when: vpn_enabled | default(false) | bool
          vars:
            hades_vpn_conf: "{{ lookup('ansible.builtin.env', vpn_conf_env) if vpn_conf_env | default('') else '' }}"
          block:
            - name: Assert the VPN config is set, a split tunnel and without DNS
              ansible.builtin.assert:
                that:
                  - hades_vpn_conf | length > 0
                  - hades_vpn_conf is not search('(?i)AllowedIPs\\s*=.*(?<![\\w.:])(0\\.0\\.0\\.0/[01]|128\\.0\\.0\\.0/1|::/[01]|8000::/1)(?!\\d)')
                  - hades_vpn_conf is not search('(?im)^\\s*DNS\\s*=')
                fail_msg: >-
                  vpn_enabled needs vpn_conf_env naming an exported environment variable that holds the
                  AmneziaWG config, with only intranet subnets in AllowedIPs and no DNS line
                quiet: true

            # Two ranges overlap when their first min(16, prefix) bits agree.
            - name: Assert vm_subnet stays clear of the VPN's AllowedIPs
              ansible.builtin.assert:
                that:
                  - hades_overlaps == []
                fail_msg: "vm_subnet {{ vm_subnet }} overlaps the VPN's AllowedIPs {{ hades_overlaps | join(', ') }}: choose another vm_subnet"
                quiet: true
              vars:
                hades_overlaps: >-
                  {% set s = vm_subnet.split('.') | map('int') | list %}{% set ns = namespace(hits=[]) %}{% for cidr in
                  (hades_vpn_conf | regex_findall('(?im)^\\s*AllowedIPs\\s*=(.*)$') | join(',')).split(',') | map('trim')
                  if cidr is match('^[0-9.]+(/[0-9]+)?$') %}{% set a = cidr.split('/')[0].split('.') | map('int') | list
                  %}{% set bits = [16, (cidr.split('/') + ['32'])[1] | int] | min %}{% if (a[0] * 256 + a[1]) // 2 ** (16 - bits)
                  == (s[0] * 256 + s[1]) // 2 ** (16 - bits) %}{% set ns.hits = ns.hits + [cidr] %}{% endif %}{% endfor %}{{ ns.hits }}

        # Last, so that each fixture above fails on its own check on any machine. A percentage is
        # that share of the host's memory.
        - name: Assert the present VMs' memory leaves the host 8 GiB
          ansible.builtin.assert:
            that:
              - hades_vm_bytes | float <= hades_host_bytes | float - 8 * 1024 ** 3
            fail_msg: >-
              the present VMs take {{ (hades_vm_bytes | float / 1024**3) | round(1) }} GiB of the host's
              {{ (hades_host_bytes | float / 1024**3) | round(1) }} GiB; lower vm_memory or an entry's memory
              so that 8 GiB stay with the host
            quiet: true
          vars:
            hades_host_bytes: "{{ ansible_facts.memtotal_mb * 1024 * 1024 }}"
            hades_vm_bytes: >-
              {% set ns = namespace(sum=0) %}{% for m in dev_present | map(attribute='memory') | map('string')
              %}{% set ns.sum = ns.sum + ((m[:-1] | float / 100 * hades_host_bytes | float) if m.endswith('%')
              else (m | regex_replace('iB$', 'B') | human_to_bytes)) %}{% endfor %}{{ ns.sum }}
